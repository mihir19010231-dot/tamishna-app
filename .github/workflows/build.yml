              function updateLeaveStatus(leaveId, newStatus) {
                let leaves = getLeaves();
                let foundIndex = leaves.findIndex(l => l.id === leaveId);
                if (foundIndex === -1) return;

                leaves[foundIndex].status = newStatus;
                saveLeaves(leaves);

                postToCloud({
                  action: 'LEAVE_STATUS',
                  leaveId: leaveId,
                  newStatus: newStatus
                });

                if (newStatus === 'APPROVED') {
                  const targetLeave = leaves[foundIndex];
                  let records = getRecords();
                  records.unshift({
                    id: 'REC-LV-' + Date.now(),
                    date: targetLeave.fromDate,
                    empId: targetLeave.empId,
                    name: targetLeave.name,
                    desig: targetLeave.desig,
                    section: targetLeave.section,
                    checkIn: 'LEAVE',
                    checkOut: targetLeave.type,
                    status: 'ON LEAVE (' + targetLeave.type + ')'
                  });
                  saveRecords(records);
                }

                alert(newStatus === 'APPROVED' ? 'ছুটি সফলভাবে অনুমোদন করা হয়েছে!' : 'ছুটির আবেদন প্রত্যাখ্যান করা হয়েছে।');
                loadAdminDashboard();
              }

