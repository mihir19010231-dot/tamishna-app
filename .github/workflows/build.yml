                    document.getElementById('loginId').value = cred.id || '';
                    document.getElementById('loginPin').value = cred.pin || '';
                    document.getElementById('rememberPinCheckbox').checked = true;
                  } catch(e) {}
                }
              }

              function handleRememberPinSave(id, pin) {
                const isChecked = document.getElementById('rememberPinCheckbox').checked;
                if (isChecked) {
