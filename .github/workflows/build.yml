      # INJECT BULLETPROOF NATIVE BIOMETRIC & REAL DOWNLOADS ENGINE INTO MAINACTIVITY
      - name: Inject Native Biometric and Real Storage Engine
        run: |
          cat << 'EOF' > tamishna/android/app/src/main/java/com/tamishna/synthetics/attendance/MainActivity.java
          package com.tamishna.synthetics.attendance;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.concurrent.Executor;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new BiometricBridge(), "AndroidBiometric");
              }

              public class BiometricBridge {
                  @JavascriptInterface
                  public void authenticate(final String actionType) {
                      runOnUiThread(() -> {
                          Executor executor = ContextCompat.getMainExecutor(MainActivity.this);
                          BiometricPrompt biometricPrompt = new BiometricPrompt(MainActivity.this, executor, new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                                  super.onAuthenticationSucceeded(result);
                                  bridge.getWebView().evaluateJavascript("window.onBiometricSuccess('" + actionType + "')", null);
                              }

                              @Override
                              public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                                  super.onAuthenticationError(errorCode, errString);
                                  bridge.getWebView().evaluateJavascript("window.onBiometricError('" + errString + "')", null);
                              }

                              @Override
                              public void onAuthenticationFailed() {
                                  super.onAuthenticationFailed();
                                  bridge.getWebView().evaluateJavascript("window.onBiometricFailed()", null);
                              }
                          });

                          String title = actionType.equals("CHECK_IN") ? "হাজিরা (Check-In) নিশ্চিতকরণ" : "প্রস্থান (Check-Out) নিশ্চিতকরণ";
                          String subtitle = "Tamishna Synthetics Limited - আঙ্গুলের ছাপ দিন";

                          BiometricPrompt.PromptInfo promptInfo = new BiometricPrompt.PromptInfo.Builder()
                                  .setTitle(title)
                                  .setSubtitle(subtitle)
                                  .setNegativeButtonText("বাতিল (Cancel)")
                                  .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK)
                                  .build();

                          biometricPrompt.authenticate(promptInfo);
                      });
                  }

                  // 100% REAL NATIVE ANDROID PDF SAVER DIRECTLY INTO DOWNLOADS DIRECTORY
                  @JavascriptInterface
                  public void savePdfToDownloads(final String base64Data, final String rawFilename) {
                      runOnUiThread(() -> {
                          try {
                              String safeFilename = rawFilename.replaceAll("[^a-zA-Z0-9._-]", "_");
                              byte[] pdfBytes = Base64.decode(base64Data, Base64.DEFAULT);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeFilename);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      OutputStream outputStream = getContentResolver().openOutputStream(uri);
                                      if (outputStream != null) {
                                          outputStream.write(pdfBytes);
                                          outputStream.flush();
                                          outputStream.close();
                                      }
                                      Toast.makeText(MainActivity.this, "✓ Job Card PDF সফলভাবে Downloads ফোল্ডারে সেভ হয়েছে!", Toast.LENGTH_LONG).show();

                                      try {
                                          Intent intent = new Intent(Intent.ACTION_VIEW);
                                          intent.setDataAndType(uri, "application/pdf");
                                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          startActivity(Intent.createChooser(intent, "PDF ফাইলটি ওপেন করুন"));
                                      } catch (Exception ignored) {}
                                  }
                              } else {
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) downloadsDir.mkdirs();
                                  File file = new File(downloadsDir, safeFilename);
                                  FileOutputStream fos = new FileOutputStream(file);
                                  fos.write(pdfBytes);
                                  fos.flush();
                                  fos.close();
                                  Toast.makeText(MainActivity.this, "✓ Job Card PDF সফলভাবে Downloads ফোল্ডারে সেভ হয়েছে!", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "PDF সেভ হতে ত্রুটি: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
