              function verifyEmployeeForSignUp() {
                const cardInput = document.getElementById('signupId').value.trim();
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                if (!cardInput) {
                  alert('দয়া করে Card No দিন!');
                  return;
                }

                const users = getUsers();
                const found = users.find(u => u.id === cardInput);

                if (!found) {
                  alertEl.innerText = 'এই Card No পাওয়া যায়নি! সঠিক আইডি দিন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  document.getElementById('signupEmpDetails').classList.add('hidden');
                  return;
                }

                const vault = getPinVault();
                if (vault[found.id]) {
                  alertEl.innerText = '⚠️ এই Card No-এর PIN ইতিমধ্যে সেট করা আছে! আপনি সরাসরি লগইন করতে পারবেন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  
                  document.getElementById('signupPin').value = '';
                  document.getElementById('signupPinConfirm').value = '';
                  document.getElementById('signupSubmitBtn').disabled = true;
                  document.getElementById('signupSubmitBtn').classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                  document.getElementById('signupSubmitBtn').disabled = false;
                  document.getElementById('signupSubmitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                }

                document.getElementById('signupEmpName').innerText = '✓ কর্মী: ' + found.name;
                document.getElementById('signupEmpDesigSec').innerText = found.desig + ' • ' + found.section;
                document.getElementById('signupEmpDetails').classList.remove('hidden');
              }

              async function handleSignUpSubmit(e) {
                e.preventDefault();
                const cardInput = document.getElementById('signupId').value.trim();
                const pin = document.getElementById('signupPin').value.trim();
                const pinConfirm = document.getElementById('signupPinConfirm').value.trim();
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                const users = getUsers();
                const found = users.find(u => u.id === cardInput);

                if (!found) {
                  alertEl.innerText = 'ভুল Card No! আইডি পাওয়া যায়নি।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                const vault = getPinVault();
                if (vault[found.id]) {
                  alertEl.innerText = '⚠️ এই কর্মীর PIN ইতিমধ্যে সেট করা রয়েছে। সরাসরি লগইন করুন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                if (pin.length < 4) {
                  alertEl.innerText = 'PIN অবশ্যই অন্তত ৪ সংখ্যার হতে হবে!';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                if (pin !== pinConfirm) {
                  alertEl.innerText = 'দুই ঘরের PIN এক হয়নি!';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                vault[found.id] = await hashPin(pin);
                savePinVault(vault);

                alert('✓ সাইন আপ সফল হয়েছে!\nকর্মী ' + found.name + '-এর PIN সফলভাবে সংরক্ষিত হয়েছে।');
                
                clearSignUpForm();
                document.getElementById('loginId').value = cardInput;
                document.getElementById('loginPin').value = pin;
                handleRememberPinSave(cardInput, pin);
                switchAuthTab('login');
              }

              let currentUser = null;

              function tick() {
                const now = new Date();
                const clockEl = document.getElementById('clock');
                if (clockEl) clockEl.innerText = now.toLocaleTimeString();
                const dateEl = document.getElementById('dateStr');
                if (dateEl) dateEl.innerText = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
              }
              setInterval(tick, 1000);
              tick();

              async function handleLoginSubmit(e) {
                e.preventDefault();
                const idInput = document.getElementById('loginId').value.trim();
                const pinInput = document.getElementById('loginPin').value.trim();
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                const users = getUsers();
                const found = users.find(u => u.id === idInput);

                if (!found) {
                  alertEl.innerText = 'ভুল Card No! এই আইডি তালিকায় নেই।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                const vault = getPinVault();
                const existingHashedPin = vault[found.id];

                if (!existingHashedPin) {
                  alertEl.innerText = 'আপনার PIN এখনও সেট করা হয়নি! "সাইন আপ" ট্যাবে গিয়ে PIN সেট করুন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                const inputHash = await hashPin(pinInput);
                if (existingHashedPin !== inputHash) {
                  alertEl.innerText = 'ভুল PIN! সঠিক গোপন পিন দিন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                handleRememberPinSave(idInput, pinInput);

                currentUser = found;
                showAppScreen();
              }

              function showAppScreen() {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('headerActions').classList.remove('hidden');
                document.getElementById('headerName').innerText = currentUser.name.split(' ')[0];
                injectLogos();

                if (currentUser.role === 'ADMIN') {
                  document.getElementById('punchView').classList.add('hidden');
                  document.getElementById('adminView').classList.remove('hidden');
                  loadAdminDashboard();
                } else {
                  document.getElementById('adminView').classList.add('hidden');
                  document.getElementById('punchView').classList.remove('hidden');
                  document.getElementById('userName').innerText = currentUser.name;
                  document.getElementById('userDesig').innerText = currentUser.desig;
                  document.getElementById('userId').innerText = currentUser.id;
                  document.getElementById('userSection').innerText = currentUser.section;
                  refreshEmployeeTodayPunch();
                  loadMyLeaves();
                }
              }

              function logout() {
                currentUser = null;
                document.getElementById('authView').classList.remove('hidden');
                document.getElementById('punchView').classList.add('hidden');
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('headerActions').classList.add('hidden');
                document.getElementById('punchStatusAlert').innerText = 'হাজিরা দিতে নিচের বাটনে চাপ দিন (ফোনের ফিঙ্গারপ্রিন্ট সেন্সর চালু হবে)';
                injectLogos();
                clearSignUpForm();
                loadRememberedCredentials();
              }

              function refreshEmployeeTodayPunch() {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const records = getRecords();
                const record = records.find(r => r.empId === currentUser.id && r.date === today);
                document.getElementById('todayInText').innerText = record ? record.checkIn : '--:--';
                document.getElementById('todayOutText').innerText = (record && record.checkOut) ? record.checkOut : '--:--';

                const leaves = getLeaves();
                const approvedToday = leaves.find(l => l.empId === currentUser.id && l.status === 'APPROVED' && today >= l.fromDate && today <= l.toDate);
                if (approvedToday) {
                  document.getElementById('punchStatusAlert').innerHTML = '<span class="text-blue-400 font-bold">ℹ️ আপনি আজ অনুমোদিত ছুটিতে আছেন (' + approvedToday.type + ')</span>';
                }
              }

              function openLeaveApplyModal() {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('leaveFrom').value = today;
                document.getElementById('leaveTo').value = today;
                document.getElementById('leaveReason').value = '';
                document.getElementById('leaveApplyModal').classList.remove('hidden');
              }
              function closeLeaveApplyModal() {
                document.getElementById('leaveApplyModal').classList.add('hidden');
              }

              function handleLeaveSubmit(e) {
                e.preventDefault();
                if (!currentUser) return;
                const type = document.getElementById('leaveType').value;
                const fromDate = document.getElementById('leaveFrom').value;
                const toDate = document.getElementById('leaveTo').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (fromDate > toDate) {
                  alert('শুরুর তারিখ শেষের তারিখের চেয়ে বড় হতে পারবে না!');
                  return;
                }

                const leaves = getLeaves();
                leaves.unshift({
                  id: 'LV-' + Date.now(),
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: new Date().toLocaleDateString('bn-BD') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  status: 'PENDING'
                });
                saveLeaves(leaves);
                closeLeaveApplyModal();
                alert('ছুটির আবেদন সফলভাবে জমা হয়েছে!');
                loadMyLeaves();
              }

              function loadMyLeaves() {
                if (!currentUser) return;
                const leaves = getLeaves().filter(l => l.empId === currentUser.id);
                const container = document.getElementById('myLeaveList');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-2">কোনো আবেদন করা হয়নি</p>';
                  return;
                }
                container.innerHTML = leaves.slice(0, 3).map(l => {
                  let badge = l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                              'bg-amber-500/20 text-amber-300 border-amber-500/40';
                  let statusText = l.status === 'APPROVED' ? 'অনুমোদিত' : l.status === 'REJECTED' ? 'বাতিল' : 'অপেক্ষারত';
                  return `
                    <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
                      <div>
                        <div class="flex items-center space-x-1.5">
                          <b class="text-white">${l.type}</b>
                          <span class="text-slate-400 text-[10px]">(${l.fromDate} হতে ${l.toDate})</span>
                        </div>
                        <p class="text-slate-400 text-[10px] truncate max-w-[200px] mt-0.5">${l.reason}</p>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badge}">${statusText}</span>
                    </div>
                  `;
                }).join('');
              }

              function switchAdminTab(tab) {
                document.getElementById('adminAttSection').classList.add('hidden');
                document.getElementById('adminLeaveSection').classList.add('hidden');
                document.getElementById('adminPinSection').classList.add('hidden');

                document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1';
                document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';

                if (tab === 'att') {
                  document.getElementById('adminAttSection').classList.remove('hidden');
                  document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                } else if (tab === 'leave') {
                  document.getElementById('adminLeaveSection').classList.remove('hidden');
                  document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center space-x-1';
                  loadAdminLeaveCards();
                } else if (tab === 'pin') {
                  document.getElementById('adminPinSection').classList.remove('hidden');
                  document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  loadAdminPinManagement();
                }
              }

              function loadAdminDashboard() {
                const records = getRecords();
                const today = new Date().toISOString().split('T')[0];
                const todayRecords = records.filter(r => r.date === today);
                const leaves = getLeaves();
                const pendingLeaves = leaves.filter(l => l.status === 'PENDING');

                document.getElementById('totalEmpCount').innerText = getUsers().length;
                document.getElementById('todayPresentCount').innerText = todayRecords.length;
                document.getElementById('pendingLeaveBadge').innerText = pendingLeaves.length;

                const tabBadge = document.getElementById('tabPendingBadge');
                if (pendingLeaves.length > 0) {
                  tabBadge.innerText = pendingLeaves.length;
                  tabBadge.classList.remove('hidden');
                } else {
                  tabBadge.classList.add('hidden');
                }

                const tbody = document.getElementById('adminTableBody');
                if (records.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500 font-sans">কোনো হাজিরার তথ্য নেই</td></tr>';
                } else {
                  tbody.innerHTML = records.map(r => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="p-2.5 text-slate-400">${r.date}</td>
                      <td class="p-2.5 font-sans font-bold text-white">${r.name}<br><span class="text-[9px] font-mono text-emerald-400">${r.empId}</span></td>
                      <td class="p-2.5 text-slate-300 font-sans">${r.section}</td>
                      <td class="p-2.5 text-emerald-400 font-bold">${r.checkIn}</td>
                      <td class="p-2.5 text-rose-400 font-bold">${r.checkOut || '--:--'}</td>
                      <td class="p-2.5 font-sans"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300">${r.status}</span></td>
                    </tr>
                  `).join('');
                }

                loadAdminLeaveCards();
                loadAdminPinManagement();
              }

              function loadAdminLeaveCards() {
                const leaves = getLeaves();
                const container = document.getElementById('adminLeaveCardsContainer');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-6">কোনো ছুটির আবেদন জমা পড়েনি</p>';
                  return;
                }
                container.innerHTML = leaves.map(l => {
                  let badge = l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                              'bg-amber-500/20 text-amber-300 border-amber-500/40';
                  let statusTitle = l.status === 'APPROVED' ? 'অনুমোদিত' : l.status === 'REJECTED' ? 'বাতিল' : 'অপেক্ষারত';

                  let actionBtns = '';
                  if (l.status === 'PENDING') {
                    actionBtns = `
                      <div class="flex space-x-2 pt-2 border-t border-slate-800">
                        <button onclick="updateLeaveStatus('${l.id}', 'APPROVED')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✓ অনুমোদন (Approve)</button>
                        <button onclick="updateLeaveStatus('${l.id}', 'REJECTED')" class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✗ প্রত্যাখ্যান (Reject)</button>
                      </div>
                    `;
                  }

                  return `
                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                      <div class="flex justify-between items-start">
                        <div>
                          <h4 class="font-bold text-white text-xs">${l.name} <span class="text-emerald-400 font-mono">(${l.empId})</span></h4>
                          <p class="text-[10px] text-slate-400">${l.desig} &bull; ${l.section}</p>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badge}">${statusTitle} (${l.type})</span>
                      </div>
                      <div class="text-[11px] bg-slate-900 p-2 rounded border border-slate-800/80">
                        <p class="text-slate-300"><b>সময়সীমা:</b> ${l.fromDate} হতে ${l.toDate}</p>
                        <p class="text-slate-300 mt-0.5"><b>কারণ:</b> ${l.reason}</p>
                        <p class="text-[9px] text-slate-500 mt-1">আবেদন: ${l.appliedOn}</p>
                      </div>
                      ${actionBtns}
                    </div>
                  `;
                }).join('');
              }

              function updateLeaveStatus(leaveId, newStatus) {
                let leaves = getLeaves();
                let foundIndex = leaves.findIndex(l => l.id === leaveId);
                if (foundIndex === -1) return;

                leaves[foundIndex].status = newStatus;
                saveLeaves(leaves);

                if (newStatus === 'APPROVED') {
                  const targetLeave = leaves[foundIndex];
                  let records = getRecords();
                  records.unshift({
                    id: 'REC-LV-' + Date.now(),
                    date: targetLeave.fromDate,
                    empId: targetLeave.empId,
                    name: targetLeave.name,
                    desig: targetLeave.desig,
                    section: targetLeave.section,
                    checkIn: 'LEAVE',
                    checkOut: targetLeave.type,
                    status: 'ON LEAVE (' + targetLeave.type + ')'
                  });
                  saveRecords(records);
                }

                alert(newStatus === 'APPROVED' ? 'ছুটি সফলভাবে অনুমোদন করা হয়েছে!' : 'ছুটির আবেদন প্রত্যাখ্যান করা হয়েছে।');
                loadAdminDashboard();
              }

              function loadAdminPinManagement() {
                const users = getUsers();
                const vault = getPinVault();
                const tbody = document.getElementById('adminPinTableBody');

                tbody.innerHTML = users.map(u => {
                  const isSet = !!vault[u.id];
                  const statusHtml = isSet 
                    ? '<span class="text-emerald-400 font-semibold text-[10px]">✓ PIN সেট করা আছে</span>' 
                    : '<span class="text-amber-400 font-semibold text-[10px]">⚠️ সেট হয়নি</span>';
                  
                  return `
                    <tr class="hover:bg-slate-800/40">
                      <td class="p-2.5 font-mono text-emerald-400 font-bold">${u.id}</td>
                      <td class="p-2.5 font-sans">${u.name}<br><span class="text-[9px] text-slate-400">${u.section}</span></td>
                      <td class="p-2.5">${statusHtml}</td>
                      <td class="p-2.5">
                        <button onclick="resetUserPin('${u.id}', '${u.name}')" class="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded text-[10px] font-bold active:scale-95">
                          রিসেট (Reset)
                        </button>
                      </td>
                    </tr>
                  `;
                }).join('');
              }

              function resetUserPin(empId, empName) {
                if (confirm(empName + ' (' + empId + ')-এর PIN রিসেট করতে চান?')) {
                  const vault = getPinVault();
                  delete vault[empId];
                  savePinVault(vault);
                  alert('✓ ' + empName + '-এর PIN রিসেট করা হয়েছে!');
                  loadAdminPinManagement();
                }
              }

              let activeExportPayload = { csv: '', filename: '', title: '' };

              function exportAttendance() {
                const records = getRecords();
                if (records.length === 0) {
                  alert('ডাউনলোড করার মতো হাজিরার ডাটা নেই!');
                  return;
                }
                let csv = 'Record ID,Date,Card No,Name,Designation,Section,Check-In,Check-Out,Status\n';
                records.forEach(r => {
                  csv += `"${r.id}","${r.date}","${r.empId}","${r.name}","${r.desig}","${r.section}","${r.checkIn}","${r.checkOut || ''}","${r.status}"\n`;
                });
                openExportModal(csv, `Tamishna_Attendance_${new Date().toISOString().split('T')[0]}.csv`, 'হাজিরা রিপোর্ট ডাউনলোড ও ক্লাউড শেয়ার');
              }

              function openExportModal(csvContent, filename, title) {
                activeExportPayload = { csv: csvContent, filename: filename, title: title };
                document.getElementById('exportModalTitle').innerText = title;
                document.getElementById('exportModal').classList.remove('hidden');
              }
              function closeExportModal() {
                document.getElementById('exportModal').classList.add('hidden');
              }

              async function triggerNativeShare() {
                const { csv, filename, title } = activeExportPayload;
                try {
                  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                  const file = new File([blob], filename, { type: 'text/csv' });

                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      title: title,
                      text: 'Tamishna Synthetics Limited Attendance Report',
                      files: [file]
                    });
                    return;
                  }
                } catch (e) {}

                if (navigator.share) {
                  try {
                    await navigator.share({ title: title, text: csv });
                    return;
                  } catch (e) {}
                }
                triggerDirectDownload();
              }

              function triggerDirectDownload() {
                const { csv, filename } = activeExportPayload;
                try {
                  const encodedUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
                  const a = document.createElement('a');
                  a.setAttribute('href', encodedUri);
                  a.setAttribute('download', filename);
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  alert('ফাইল ডাউনলোড সফল হয়েছে! Downloads ফোল্ডার চেক করুন।');
                } catch (e) {
                  alert('ব্রাউজার ডাউনলোড ব্লক করেছে। "কপি করুন" বাটনটি ব্যবহার করুন।');
                }
              }

              function triggerClipboardCopy() {
                const { csv } = activeExportPayload;
                const tsv = csv.split('\n').map(row => {
                  return row.split(',').map(cell => cell.replace(/^"|"$/g, '')).join('\t');
                }).join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(tsv).then(() => {
                    alert('✓ সম্পূর্ণ এক্সেল ডাটা সফলভাবে কপি হয়েছে!\nযেকোনো Excel বা Google Sheet-এ গিয়ে সরাসরি Paste করুন।');
                  }).catch(() => fallbackCopy(tsv));
                } else {
                  fallbackCopy(tsv);
                }
              }

              function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('✓ সম্পূর্ণ এক্সেল ডাটা কপি হয়েছে! Excel-এ গিয়ে Paste করুন।');
              }

              function clearAllData() {
                if (confirm('আপনি কি সমস্ত হাজিরার ডাটা মুছে ফেলতে চান?')) {
                  localStorage.removeItem('tsl_records_v12');
                  loadAdminDashboard();
                }
              }

              document.addEventListener('DOMContentLoaded', loadRememberedCredentials);
              setTimeout(loadRememberedCredentials, 200);
            </script>
          </body>
          </html>
          EOF
