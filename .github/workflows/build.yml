      # GENERATE MATCHING TAMISHNA 'T' BRAND APP LAUNCHER ICONS (ALL SIZES)
      - name: Generate Official Tamishna 'T' App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          def create_tamishna_t_icon(sz):
              img = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              draw.ellipse([sz*0.03, sz*0.03, sz*0.97, sz*0.97], fill='#0c4182')
              draw.ellipse([sz*0.16, sz*0.16, sz*0.84, sz*0.84], fill='#ffffff', outline='#0c4182', width=max(1, int(sz*0.025)))

              top_w = sz * 0.52
              top_h = sz * 0.14
              top_x = (sz - top_w) / 2
              top_y = sz * 0.28
              draw.rectangle([top_x, top_y, top_x + top_w, top_y + top_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              stem_w = sz * 0.24
              stem_h = sz * 0.36
              stem_x = (sz - stem_w) / 2
              stem_y = top_y + top_h - 1
              draw.rectangle([stem_x, stem_y, stem_x + stem_w, stem_y + stem_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              return img

          res_path = 'tamishna/android/app/src/main/res'
          for folder, size in sizes.items():
              target_dir = os.path.join(res_path, folder)
              os.makedirs(target_dir, exist_ok=True)
              icon = create_tamishna_t_icon(size)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          xml_folder = os.path.join(res_path, 'mipmap-anydpi-v26')
          if os.path.exists(xml_folder):
              import shutil
              shutil.rmtree(xml_folder)
          print("✓ Official Tamishna 'T' App Icons generated successfully!")
          EOF

