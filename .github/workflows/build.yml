name: Build APK Free

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for Image Generation
        run: pip install pillow

      - name: Create and Build Project
        run: |
          mkdir -p tamishna
          cd tamishna
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Tamishna Synthetics Ltd. - Attendance & Job Card Portal</title>
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
          </head>
          <body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans select-none pb-8">
            
            <!-- TAMISHNA GROUP LOGO COMPONENT -->
            <template id="tamishnaLogoTpl">
              <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <path id="tgTextPath" d="M 28,125 A 72,72 0 0,0 172,125" />
                </defs>
                <circle cx="100" cy="100" r="92" fill="#0c4182" />
                <path d="M 88 5 L 112 5 L 109 18 L 91 18 Z
                         M 148 24 L 166 40 L 155 50 L 137 36 Z
                         M 183 82 L 196 100 L 183 108 L 170 94 Z
                         M 166 153 L 148 169 L 137 156 L 155 142 Z
                         M 112 195 L 88 195 L 91 182 L 109 182 Z
                         M 34 169 L 16 153 L 29 141 L 46 155 Z
                         M 5 100 L 18 82 L 30 94 L 18 108 Z
                         M 16 40 L 34 24 L 46 38 L 30 52 Z" fill="#ffffff" />
                <circle cx="100" cy="100" r="82" fill="none" stroke="#0c4182" stroke-width="12" />
                <circle cx="100" cy="100" r="66" fill="#ffffff" stroke="#0c4182" stroke-width="4" />
                <path d="M 52 74 L 148 74 C 146 64 134 60 100 60 C 66 60 54 64 52 74 Z" fill="#f26522" stroke="#0c4182" stroke-width="3" />
                <path d="M 52 74 L 74 74 L 74 138 C 84 142 116 142 126 138 L 126 74 L 148 74 L 142 84 L 126 84 L 126 140 C 110 146 90 146 74 140 L 74 84 L 58 84 Z" fill="#f26522" stroke="#0c4182" stroke-width="3" stroke-linejoin="round" />
                <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" letter-spacing="2.2">
                  <textPath href="#tgTextPath" startOffset="50%" text-anchor="middle">TAMISHNA GROUP</textPath>
                </text>
              </svg>
            </template>

            <!-- APP HEADER -->
            <header class="bg-slate-900 border-b border-slate-800 p-2.5 sticky top-0 z-30 flex justify-between items-center shadow-lg">
              <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-full bg-white p-0.5 flex items-center justify-center shadow-md flex-shrink-0" id="headerLogoSlot"></div>
                <div>
                  <div class="flex items-center space-x-1.5">
                    <h1 class="text-xs font-bold text-white tracking-wide">Tamishna Synthetics Ltd.</h1>
                    <span class="text-[8px] bg-blue-500/20 text-blue-300 font-mono font-bold px-1.5 py-0.2 rounded border border-blue-500/30">Official App</span>
                  </div>
                  <div class="flex items-center space-x-1.5">
                    <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="cloudStatusText" class="text-[9px] text-emerald-400 font-medium">Google Sheet Cloud Active</span>
                  </div>
                </div>
              </div>
              <div id="headerActions" class="hidden flex items-center space-x-2">
                <span id="headerName" class="text-[10px] text-slate-300 font-medium"></span>
                <button onclick="logout()" class="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg text-[10px] font-bold active:scale-95">Logout</button>
              </div>
            </header>

            <!-- 1. LOGIN & SIGN UP SCREEN (WITH 3 DEDICATED TABS) -->
            <main id="authView" class="flex-1 p-4 max-w-sm mx-auto w-full flex flex-col justify-center">
              <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
                <div class="text-center mb-4">
                  <div class="w-16 h-16 mx-auto bg-white rounded-full p-1 shadow-xl shadow-blue-900/30 mb-2" id="loginLogoSlot"></div>
                  <div class="flex items-center justify-center space-x-1.5">
                    <h2 class="text-base font-extrabold text-white">Attendance & Job Card Portal</h2>
                    <span class="text-[9px] bg-blue-500/20 text-blue-300 font-mono font-bold px-1.5 py-0.5 rounded border border-blue-500/30">TSL</span>
                  </div>
                  <p class="text-[10px] text-slate-400 mt-0.5">Plant: Gazipur &bull; Cloud Connected</p>
                </div>

                <!-- 3 TABS: LOGIN, SET PIN, NEW EMPLOYEE -->
                <div class="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-4 text-[11px] font-bold">
                  <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="py-2 rounded-lg bg-emerald-500 text-slate-950 transition">Login</button>
                  <button id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Set PIN</button>
                  <button id="tabBtnNewStaff" onclick="switchAuthTab('newstaff')" class="py-2 rounded-lg text-slate-400 hover:text-white transition">+ New Staff</button>
                </div>

                <div id="authAlert" class="hidden p-2.5 mb-3 rounded-xl text-xs text-center font-medium"></div>

                <!-- FORM 1: LOGIN -->
                <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-3" autocomplete="off">
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Card No / Employee ID</label>
                    <input type="text" id="loginId" required placeholder="Enter Card No" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 text-xs font-mono focus:outline-none focus:border-emerald-500" autocomplete="off">
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Secret PIN</label>
                    <input type="password" id="loginPin" required maxlength="6" placeholder="Enter PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500" autocomplete="new-password">
                  </div>

                  <div class="flex items-center justify-between py-1">
                    <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer select-none">
                      <input type="checkbox" id="rememberPinCheckbox" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                      <span>Remember PIN</span>
                    </label>
                  </div>

                  <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 active:scale-95 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-500/25 text-xs mt-1">
                    Login Now
                  </button>
                  <div class="text-center pt-2">
                    <button type="button" onclick="switchAuthTab('newstaff')" class="text-[11px] text-emerald-400 hover:underline">New staff? Register here ➔</button>
                  </div>
                </form>

                <!-- FORM 2: SET PIN (EXISTING STAFF) -->
                <form id="signupForm" onsubmit="handleSignUpSubmit(event)" class="hidden space-y-3" autocomplete="off">
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Existing Card No</label>
                    <div class="flex space-x-1.5">
                      <input type="text" id="signupId" required placeholder="Enter Card No" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs font-mono focus:outline-none focus:border-emerald-500" autocomplete="off">
                      <button type="button" onclick="verifyEmployeeForSignUp()" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold active:scale-95">Verify</button>
                    </div>
                  </div>

                  <div id="signupEmpDetails" class="hidden p-2.5 bg-slate-950/90 rounded-xl border border-slate-800 text-xs space-y-0.5">
                    <p class="text-white font-bold" id="signupEmpName"></p>
                    <p class="text-slate-400 text-[10px]" id="signupEmpDesigSec"></p>
                  </div>

                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">New 4-Digit Secret PIN</label>
                    <input type="password" id="signupPin" required maxlength="6" placeholder="Enter new PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500" autocomplete="new-password">
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Confirm Secret PIN</label>
                    <input type="password" id="signupPinConfirm" required maxlength="6" placeholder="Re-enter PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500" autocomplete="new-password">
                  </div>

                  <button id="signupSubmitBtn" type="submit" class="w-full bg-blue-600 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/25 text-xs mt-1">
                    ✓ Complete PIN Setup
                  </button>
                </form>

                <!-- FORM 3: NEW EMPLOYEE REGISTRATION (ID MUST START WITH 100) -->
                <form id="newStaffForm" onsubmit="handleNewStaffSubmit(event)" class="hidden space-y-2.5" autocomplete="off">
                  <div>
                    <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Employee Name</label>
                    <input type="text" id="newStaffName" required placeholder="Full Name" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-500">
                  </div>
                  <div>
                    <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Card No / ID (Must start with 100)</label>
                    <input type="text" id="newStaffId" required placeholder="e.g. 10009999" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs font-mono focus:outline-none focus:border-emerald-500">
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Designation</label>
                      <input type="text" id="newStaffDesig" required placeholder="e.g. Operator" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                      <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Section</label>
                      <input type="text" id="newStaffSection" required placeholder="e.g. Twisting" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-500">
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Secret PIN</label>
                      <input type="password" id="newStaffPin" required maxlength="6" placeholder="4-digit PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                      <label class="block text-[10px] font-semibold text-slate-300 uppercase tracking-wider mb-0.5">Confirm PIN</label>
                      <input type="password" id="newStaffPinConfirm" required maxlength="6" placeholder="Re-enter PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500">
                    </div>
                  </div>

                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-600/25 text-xs mt-1">
                    ✓ Register & Auto Include
                  </button>
                </form>

              </div>
            </main>

            <!-- 2. EMPLOYEE PUNCH SCREEN (SUPER FAST ONE-TAP PUNCH) -->
            <main id="punchView" class="flex-1 p-4 max-w-md mx-auto w-full hidden flex flex-col justify-center space-y-4">
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-3 min-w-0">
                  <div class="w-12 h-12 rounded-full bg-white p-0.5 shadow flex-shrink-0" id="profileLogoSlot"></div>
                  <div class="min-w-0">
                    <h2 id="userName" class="text-sm font-bold text-white truncate"></h2>
                    <p class="text-[11px] text-slate-300 truncate" id="userDesig"></p>
                    <p class="text-[10px] text-emerald-400 font-mono mt-0.5">Card: <span id="userId" class="font-bold"></span> &bull; <span id="userSection"></span></p>
                  </div>
                </div>
                <div class="flex flex-col space-y-1.5 flex-shrink-0">
                  <button onclick="viewEmployeeJobCard()" class="px-2.5 py-1.5 bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 rounded-xl text-[10px] font-bold active:scale-95 flex items-center space-x-1">
                    <span>📋</span>
                    <span>My Job Card</span>
                  </button>
                  <button onclick="openLeaveApplyModal()" class="px-2.5 py-1.5 bg-blue-600/20 border border-blue-500/40 text-blue-300 rounded-xl text-[10px] font-bold active:scale-95 flex items-center space-x-1">
                    <span>📝</span>
                    <span>Leave</span>
                  </button>
                </div>
              </div>

              <!-- LIVE CLOCK -->
              <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 text-center shadow-lg">
                <p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold">Bangladesh Standard Time</p>
                <div id="clock" class="text-3xl font-mono font-extrabold text-emerald-400 my-1">--:--:--</div>
                <p id="dateStr" class="text-xs text-slate-300 font-medium"></p>
              </div>

              <div id="punchStatusAlert" class="p-3 bg-slate-900 rounded-xl text-xs text-center border border-slate-800 text-slate-300 font-medium transition duration-200">
                Tap button below to record attendance (One-Tap Instant Punch)
              </div>

              <!-- ONE-TAP DIRECT PUNCH BUTTONS -->
              <div class="grid grid-cols-2 gap-3 pt-1">
                <button onclick="recordPunch('CHECK_IN')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-emerald-500 text-center flex flex-col items-center">
                  <span class="text-3xl mb-1">⏱️</span>
                  <span class="text-xs font-bold">Punch Check-In</span>
                  <span class="text-[9px] text-emerald-200 mt-0.5">Instant Entry</span>
                </button>
                <button onclick="recordPunch('CHECK_OUT')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-rose-500 text-center flex flex-col items-center">
                  <span class="text-3xl mb-1">🚪</span>
                  <span class="text-xs font-bold">Punch Check-Out</span>
                  <span class="text-[9px] text-rose-200 mt-0.5">Instant Exit</span>
                </button>
              </div>

              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <p class="text-[10px] text-slate-400 uppercase font-semibold mb-1">Today's Attendance Status</p>
                <div class="flex justify-between text-xs text-slate-300">
                  <span>Check-In: <b id="todayInText" class="text-emerald-400 font-mono">--:--</b></span>
                  <span>Check-Out: <b id="todayOutText" class="text-rose-400 font-mono">--:--</b></span>
                </div>
              </div>

              <div class="text-center pt-1">
                <button onclick="logout()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-semibold text-rose-400 active:scale-95">
                  Logout
                </button>
              </div>
            </main>

            <!-- 3. ADMIN PANEL (CENTRAL DASHBOARD - PERMANENT DATA UNLESS DELETED) -->
            <main id="adminView" class="flex-1 p-4 max-w-2xl mx-auto w-full hidden space-y-4">
              <div class="flex justify-between items-center bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow">
                <div class="flex items-center space-x-2.5">
                  <div class="w-8 h-8 rounded-full bg-white p-0.5 shadow flex-shrink-0" id="adminLogoSlot"></div>
                  <div>
                    <div class="flex items-center space-x-1.5">
                      <h2 class="text-xs font-bold text-white">Admin Dashboard</h2>
                      <span class="text-[8px] bg-blue-500/20 text-blue-300 font-mono px-1 py-0.2 rounded border border-blue-500/30">Google Sheet Live</span>
                    </div>
                    <p class="text-[10px] text-emerald-400">Tamishna Synthetics Limited</p>
                  </div>
                </div>

                <div class="flex space-x-1.5">
                  <button onclick="openPDFExportModal()" class="bg-rose-500 hover:bg-rose-400 active:scale-95 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs shadow flex items-center space-x-1">
                    <span>📄 Save PDF</span>
                  </button>
                  <button onclick="exportAttendanceCSV()" class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold px-2.5 py-1.5 rounded-lg text-xs shadow flex items-center space-x-1">
                    <span>📊 Save Excel</span>
                  </button>
                </div>
              </div>

              <!-- STATS -->
              <div class="grid grid-cols-3 gap-2.5 text-center">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">Total Staff</span>
                  <p id="totalEmpCount" class="text-base font-bold text-white">51</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">Present Today (All Phones)</span>
                  <p id="todayPresentCount" class="text-base font-bold text-emerald-400">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">Pending Leaves</span>
                  <p id="pendingLeaveBadge" class="text-base font-bold text-amber-400">0</p>
                </div>
              </div>

              <!-- LIVE CLOUD SYNC STATUS BAR -->
              <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span class="text-slate-300 text-[11px]">Google Sheet Connected (Syncs across all phones)</span>
                </div>
                <button onclick="pullAllFromCloud(true)" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-lg text-xs font-bold flex items-center space-x-1 shadow">
                  <span>🔄 Refresh Now</span>
                </button>
              </div>

              <!-- ADMIN TABS -->
              <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                <button id="adminTabAtt" onclick="switchAdminTab('att')" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">Attendance Logs</button>
                <button id="adminTabJobCard" onclick="switchAdminTab('jobcard')" class="flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white">📋 Job Card Search</button>
                <button id="adminTabLeave" onclick="switchAdminTab('leave')" class="flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1">
                  <span>Leaves</span>
                  <span id="tabPendingBadge" class="hidden px-1.5 py-0.2 bg-amber-500 text-slate-950 text-[9px] rounded-full font-bold">0</span>
                </button>
                <button id="adminTabPin" onclick="switchAdminTab('pin')" class="flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white">PIN List</button>
              </div>

              <!-- VIEW A: SIMPLIFIED ATTENDANCE LOG (DATE, NAME, SECTION, STATUS, DELETE) -->
              <div id="adminAttSection" class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow">
                <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-xs">
                  <span class="text-slate-300 font-semibold">Attendance Log (Date, Employee, Section, Status)</span>
                  <button onclick="clearAllData()" class="text-rose-400 text-[10px] hover:underline font-bold">Clear All Records</button>
                </div>
                <div class="overflow-x-auto max-h-96">
                  <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[9px] font-semibold sticky top-0">
                      <tr>
                        <th class="p-2.5">Date</th>
                        <th class="p-2.5">Employee Name & ID</th>
                        <th class="p-2.5">Section</th>
                        <th class="p-2.5">Status</th>
                        <th class="p-2.5 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800 font-mono text-[11px]"></tbody>
                  </table>
                </div>
              </div>

              <!-- VIEW B: FACTORY STANDARD INDIVIDUAL JOB CARD (IN TIME, OUT TIME, LEAVE FULL MONTH) -->
              <div id="adminJobCardSection" class="hidden bg-slate-900 rounded-xl border border-slate-800 p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                  <div>
                    <h3 class="text-xs font-bold text-white">Monthly Attendance Job Card (Factory ERP Standard)</h3>
                    <p class="text-[10px] text-slate-400">Tamishna Synthetics Limited &bull; Gazipur Plant</p>
                  </div>
                  <button onclick="downloadJobCardPDF()" class="px-2.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold active:scale-95 flex items-center space-x-1 shadow">
                    <span>📄 Save Job Card PDF</span>
                  </button>
                </div>

                <!-- FAST DEBOUNCED SEARCH BAR -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                  <label class="block text-slate-300 font-semibold text-xs">🔍 Search Job Card by Card No / ID:</label>
                  <div class="flex space-x-2">
