              async function handleSignUpSubmit(e) {
                e.preventDefault();
                const cardInput = document.getElementById('signupId').value.trim();
                const pin = document.getElementById('signupPin').value.trim();
                const pinConfirm = document.getElementById('signupPinConfirm').value.trim();
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                const users = getUsers();
                const found = users.find(u => u.id === cardInput);

                if (!found) {
                  alertEl.innerText = 'ভুল Card No! আইডি পাওয়া যায়নি।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                const vault = getPinVault();
                if (vault[found.id]) {
                  alertEl.innerText = '⚠️ এই কর্মীর PIN ইতিমধ্যে সেট করা রয়েছে। সরাসরি লগইন করুন।';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                if (pin.length < 4) {
                  alertEl.innerText = 'PIN অবশ্যই অন্তত ৪ সংখ্যার হতে হবে!';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
