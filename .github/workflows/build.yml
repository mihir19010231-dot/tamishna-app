                e.preventDefault();
                if (!currentUser) return;
                const type = document.getElementById('leaveType').value;
                const fromDate = document.getElementById('leaveFrom').value;
                const toDate = document.getElementById('leaveTo').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (fromDate > toDate) {
                  alert('শুরুর তারিখ শেষের তারিখের চেয়ে বড় হতে পারবে না!');
                  return;
                }

                const leaves = getLeaves();
                leaves.unshift({
                  id: 'LV-' + Date.now(),
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: new Date().toLocaleDateString('bn-BD') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  status: 'PENDING'
                });
                saveLeaves(leaves);
                closeLeaveApplyModal();
                alert('ছুটির আবেদন সফলভাবে জমা হয়েছে!');
              }

              function switchAdminTab(tab) {
                document.getElementById('adminAttSection').classList.add('hidden');
                document.getElementById('adminJobCardSection').classList.add('hidden');
                document.getElementById('adminLeaveSection').classList.add('hidden');
                document.getElementById('adminPinSection').classList.add('hidden');

                document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                document.getElementById('adminTabJobCard').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1';
                document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';

                if (tab === 'att') {
                  document.getElementById('adminAttSection').classList.remove('hidden');
                  document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                } else if (tab === 'jobcard') {
                  document.getElementById('adminJobCardSection').classList.remove('hidden');
                  document.getElementById('adminTabJobCard').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  renderSelectedEmployeeJobCard();
                } else if (tab === 'leave') {
                  document.getElementById('adminLeaveSection').classList.remove('hidden');
                  document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center space-x-1';
                  loadAdminLeaveCards();
                } else if (tab === 'pin') {
                  document.getElementById('adminPinSection').classList.remove('hidden');
                  document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  loadAdminPinManagement();
                }
              }

              function loadAdminDashboard() {
                const records = getRecords();
                const today = new Date().toISOString().split('T')[0];
                const todayRecords = records.filter(r => r.date === today);
                const leaves = getLeaves();
                const pendingLeaves = leaves.filter(l => l.status === 'PENDING');

                document.getElementById('totalEmpCount').innerText = getUsers().length;
                document.getElementById('todayPresentCount').innerText = todayRecords.length;
                document.getElementById('pendingLeaveBadge').innerText = pendingLeaves.length;

                const tabBadge = document.getElementById('tabPendingBadge');
                if (pendingLeaves.length > 0) {
                  tabBadge.innerText = pendingLeaves.length;
                  tabBadge.classList.remove('hidden');
                } else {
                  tabBadge.classList.add('hidden');
                }

                const tbody = document.getElementById('adminTableBody');
                if (records.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-500 font-sans">কোনো হাজিরার তথ্য নেই</td></tr>';
                } else {
                  tbody.innerHTML = records.map(r => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="p-2.5 text-slate-400">${r.date}</td>
                      <td class="p-2.5 font-sans font-bold text-white">${r.name}<br><span class="text-[9px] font-mono text-emerald-400">${r.empId}</span></td>
                      <td class="p-2.5 text-slate-300 font-sans">${r.section}</td>
                      <td class="p-2.5 text-emerald-400 font-bold">${r.checkIn}</td>
                      <td class="p-2.5 text-rose-400 font-bold">${r.checkOut || '--:--'}</td>
                      <td class="p-2.5 font-sans"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300">${r.status}</span></td>
                      <td class="p-2.5 text-center">
                        <button onclick="deleteSingleRecord('${r.id}')" class="p-1 text-rose-400 hover:text-rose-300 hover:bg-rose-500/20 rounded active:scale-90" title="রেকর্ড মুছুন">
                          🗑️
                        </button>
                      </td>
                    </tr>
                  `).join('');
                }

                loadAdminLeaveCards();
                loadAdminPinManagement();
              }

              function deleteSingleRecord(recordId) {
                if (confirm('আপনি কি এই হাজিরার রেকর্ডটি মুছে ফেলতে চান?\nমুছে ফেললে এক্সেল ও জব কার্ড থেকেও এটি চিরতরে বাদ যাবে।')) {
                  let records = getRecords();
                  records = records.filter(r => r.id !== recordId);
                  saveRecords(records);
                  loadAdminDashboard();
                  alert('✓ রেকর্ডটি সফলভাবে মুছে ফেলা হয়েছে!');
                }
              }

              function loadAdminLeaveCards() {
                const leaves = getLeaves();
                const container = document.getElementById('adminLeaveCardsContainer');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-6">কোনো ছুটির আবেদন জমা পড়েনি</p>';
                  return;
                }
                container.innerHTML = leaves.map(l => `
                  <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-start">
                      <div>
                        <h4 class="font-bold text-white text-xs">${l.name} <span class="text-emerald-400 font-mono">(${l.empId})</span></h4>
                        <p class="text-[10px] text-slate-400">${l.desig} &bull; ${l.section}</p>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : 'bg-amber-500/20 text-amber-300 border-amber-500/40'}">${l.status} (${l.type})</span>
                    </div>
                    <div class="text-[11px] bg-slate-900 p-2 rounded border border-slate-800/80">
                      <p class="text-slate-300"><b>সময়সীমা:</b> ${l.fromDate} হতে ${l.toDate}</p>
                      <p class="text-slate-300 mt-0.5"><b>কারণ:</b> ${l.reason}</p>
                    </div>
                    ${l.status === 'PENDING' ? `
                      <div class="flex space-x-2 pt-2 border-t border-slate-800">
                        <button onclick="updateLeaveStatus('${l.id}', 'APPROVED')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✓ অনুমোদন</button>
                        <button onclick="updateLeaveStatus('${l.id}', 'REJECTED')" class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✗ বাতিল</button>
                      </div>
                    ` : ''}
                  </div>
                `).join('');
              }

              function updateLeaveStatus(leaveId, newStatus) {
                let leaves = getLeaves();
                let foundIndex = leaves.findIndex(l => l.id === leaveId);
                if (foundIndex === -1) return;

                leaves[foundIndex].status = newStatus;
                saveLeaves(leaves);
                alert(newStatus === 'APPROVED' ? 'ছুটি অনুমোদন করা হয়েছে!' : 'ছুটি বাতিল করা হয়েছে।');
                loadAdminDashboard();
              }

              function loadAdminPinManagement() {
                const users = getUsers();
                const vault = getPinVault();
                const tbody = document.getElementById('adminPinTableBody');

                tbody.innerHTML = users.map(u => `
                  <tr class="hover:bg-slate-800/40">
                    <td class="p-2.5 font-mono text-emerald-400 font-bold">${u.id}</td>
                    <td class="p-2.5 font-sans">${u.name}<br><span class="text-[9px] text-slate-400">${u.section}</span></td>
                    <td class="p-2.5">${vault[u.id] ? '<span class="text-emerald-400 font-semibold text-[10px]">✓ PIN সেট আছে</span>' : '<span class="text-amber-400 font-semibold text-[10px]">⚠️ সেট হয়নি</span>'}</td>
                    <td class="p-2.5">
                      <button onclick="resetUserPin('${u.id}', '${u.name}')" class="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded text-[10px] font-bold active:scale-95">
                        রিসেট
                      </button>
                    </td>
                  </tr>
                `).join('');
              }

              function resetUserPin(empId, empName) {
                if (confirm(empName + ' (' + empId + ')-এর PIN রিসেট করতে চান?')) {
                  const vault = getPinVault();
                  delete vault[empId];
                  savePinVault(vault);
                  alert('✓ PIN রিসেট করা হয়েছে!');
                  loadAdminPinManagement();
                }
              }

              function exportAttendanceCSV() {
                const records = getRecords();
                if (records.length === 0) {
                  alert('ডাউনলোড করার মতো হাজিরার ডাটা নেই!');
                  return;
                }
                let csv = 'DATE,CARD_NO,EMPLOYEE_NAME,SECTION,IN_TIME,OUT_TIME,STATUS\n';
                records.forEach(r => {
                  csv += `"${r.date}","${r.empId}","${r.name}","${r.section}","${r.checkIn}","${r.checkOut || ''}","${r.status}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Tamishna_ERP_Attendance_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              }

              function clearAllData() {
                if (confirm('আপনি কি সমস্ত হাজিরার ডাটা মুছে ফেলতে চান?\nমুছে ফেললে অ্যাপ ও এক্সেল ফাইল উভয়ের ডাটাই চিরতরে খালি হয়ে যাবে।')) {
                  localStorage.removeItem('tsl_records_v18');
                  loadAdminDashboard();
                  alert('✓ অ্যাপের সমস্ত হাজিরার ডাটা সম্পূর্ণ মুছে ফেলা হয়েছে!');
                }
              }

              document.addEventListener('DOMContentLoaded', loadRememberedCredentials);
              setTimeout(loadRememberedCredentials, 200);
            </script>
          </body>
          </html>
          EOF
