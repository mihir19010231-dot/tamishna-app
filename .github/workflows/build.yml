      # INJECT NATIVE STORAGE & FAST ASYNC REDIRECT HANDLER (NO BIOMETRIC SENSOR DEPENDENCY)
      - name: Inject Native Storage and Cloud Bridge into MainActivity
        run: |
          cat << 'EOF' > tamishna/android/app/src/main/java/com/tamishna/synthetics/attendance/MainActivity.java
          package com.tamishna.synthetics.attendance;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new StorageBridge(), "AndroidBridge");
              }

              public class StorageBridge {
                  // NATIVE HTTP HANDLER: INSTANT RESPONSE & HANDLES GOOGLE APPS SCRIPT REDIRECTS
                  @JavascriptInterface
                  public String cloudGetRequest(final String targetUrl) {
                      try {
                          URL url = new URL(targetUrl);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setInstanceFollowRedirects(true);
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);

                          int status = conn.getResponseCode();
                          if (status == HttpURLConnection.HTTP_MOVED_TEMP || status == HttpURLConnection.HTTP_MOVED_PERM || status == 307) {
                              String newUrl = conn.getHeaderField("Location");
                              conn = (HttpURLConnection) new URL(newUrl).openConnection();
                              conn.setRequestMethod("GET");
                          }

                          BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                          StringBuilder resp = new StringBuilder();
                          String line;
                          while ((line = in.readLine()) != null) {
                              resp.append(line);
                          }
                          in.close();
                          return resp.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  // NATIVE PDF SAVER DIRECTLY INTO DOWNLOADS
                  @JavascriptInterface
                  public void savePdfToDownloads(final String base64Data, final String rawFilename) {
                      runOnUiThread(() -> {
                          try {
                              String safeFilename = rawFilename.replaceAll("[^a-zA-Z0-9._-]", "_");
                              byte[] pdfBytes = Base64.decode(base64Data, Base64.DEFAULT);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeFilename);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      OutputStream outputStream = getContentResolver().openOutputStream(uri);
                                      if (outputStream != null) {
                                          outputStream.write(pdfBytes);
                                          outputStream.flush();
                                          outputStream.close();
                                      }
                                      Toast.makeText(MainActivity.this, "✓ PDF saved to Downloads folder!", Toast.LENGTH_LONG).show();

                                      try {
                                          Intent intent = new Intent(Intent.ACTION_VIEW);
                                          intent.setDataAndType(uri, "application/pdf");
                                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          startActivity(Intent.createChooser(intent, "Open PDF"));
                                      } catch (Exception ignored) {}
                                  }
                              } else {
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) downloadsDir.mkdirs();
                                  File file = new File(downloadsDir, safeFilename);
                                  FileOutputStream fos = new FileOutputStream(file);
                                  fos.write(pdfBytes);
                                  fos.flush();
                                  fos.close();
                                  Toast.makeText(MainActivity.this, "✓ PDF saved to Downloads folder!", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "PDF save error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  // NATIVE EXCEL / CSV SAVER DIRECTLY INTO DOWNLOADS
                  @JavascriptInterface
                  public void saveCsvToDownloads(final String csvContent, final String rawFilename) {
                      runOnUiThread(() -> {
                          try {
                              String safeFilename = rawFilename.replaceAll("[^a-zA-Z0-9._-]", "_");
                              byte[] csvBytes = csvContent.getBytes(StandardCharsets.UTF_8);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeFilename);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, "text/csv");
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      OutputStream outputStream = getContentResolver().openOutputStream(uri);
                                      if (outputStream != null) {
                                          outputStream.write(csvBytes);
                                          outputStream.flush();
                                          outputStream.close();
                                      }
                                      Toast.makeText(MainActivity.this, "✓ Excel CSV saved to Downloads folder!", Toast.LENGTH_LONG).show();

                                      try {
                                          Intent intent = new Intent(Intent.ACTION_VIEW);
                                          intent.setDataAndType(uri, "text/csv");
                                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          startActivity(Intent.createChooser(intent, "Open Excel File"));
                                      } catch (Exception ignored) {}
                                  }
                              } else {
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) downloadsDir.mkdirs();
                                  File file = new File(downloadsDir, safeFilename);
                                  FileOutputStream fos = new FileOutputStream(file);
                                  fos.write(csvBytes);
                                  fos.flush();
                                  fos.close();
                                  Toast.makeText(MainActivity.this, "✓ Excel CSV saved to Downloads folder!", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Excel save error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

      # GENERATE TAMISHNA GROUP APP LAUNCHER ICONS (ALL SIZES)
      - name: Generate Official Tamishna Group App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          def create_tamishna_icon(sz):
              img = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              draw.ellipse([sz*0.03, sz*0.03, sz*0.97, sz*0.97], fill='#0c4182')
              draw.ellipse([sz*0.17, sz*0.17, sz*0.83, sz*0.83], fill='#ffffff', outline='#0c4182', width=max(1, int(sz*0.025)))

              top_w = sz * 0.46
              top_h = sz * 0.12
              top_x = (sz - top_w) / 2
              top_y = sz * 0.30
              draw.rectangle([top_x, top_y, top_x + top_w, top_y + top_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              stem_w = sz * 0.22
              stem_h = sz * 0.32
              stem_x = (sz - stem_w) / 2
              stem_y = top_y + top_h - 1
              draw.rectangle([stem_x, stem_y, stem_x + stem_w, stem_y + stem_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              return img

          res_path = 'tamishna/android/app/src/main/res'
          for folder, size in sizes.items():
              target_dir = os.path.join(res_path, folder)
              os.makedirs(target_dir, exist_ok=True)
              icon = create_tamishna_icon(size)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          xml_folder = os.path.join(res_path, 'mipmap-anydpi-v26')
          if os.path.exists(xml_folder):
              import shutil
              shutil.rmtree(xml_folder)
          print("✓ Official Tamishna Group App Launcher Icons generated successfully!")
          EOF

