name: Build APK Free

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for Image Generation
        run: pip install pillow

      - name: Create and Build Project
        run: |
          mkdir -p tamishna
          cd tamishna
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="bn">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Tamishna Synthetics Ltd. - Attendance & Leave Portal</title>
            <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans select-none pb-8">
            
            <!-- TAMISHNA GROUP LOGO COMPONENT -->
            <template id="tamishnaLogoTpl">
              <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <path id="tgTextPath" d="M 28,125 A 72,72 0 0,0 172,125" />
                </defs>
                <circle cx="100" cy="100" r="92" fill="#0c4182" />
                <path d="M 88 5 L 112 5 L 109 18 L 91 18 Z
                         M 148 24 L 166 40 L 155 50 L 137 36 Z
                         M 183 82 L 196 100 L 183 108 L 170 94 Z
                         M 166 153 L 148 169 L 137 156 L 155 142 Z
                         M 112 195 L 88 195 L 91 182 L 109 182 Z
                         M 34 169 L 16 153 L 29 141 L 46 155 Z
                         M 5 100 L 18 82 L 30 94 L 18 108 Z
                         M 16 40 L 34 24 L 46 38 L 30 52 Z" fill="#ffffff" />
                <circle cx="100" cy="100" r="82" fill="none" stroke="#0c4182" stroke-width="12" />
                <circle cx="100" cy="100" r="66" fill="#ffffff" stroke="#0c4182" stroke-width="4" />
                <path d="M 52 74 L 148 74 C 146 64 134 60 100 60 C 66 60 54 64 52 74 Z" fill="#f26522" stroke="#0c4182" stroke-width="3" />
                <path d="M 52 74 L 74 74 L 74 138 C 84 142 116 142 126 138 L 126 74 L 148 74 L 142 84 L 126 84 L 126 140 C 110 146 90 146 74 140 L 74 84 L 58 84 Z" fill="#f26522" stroke="#0c4182" stroke-width="3" stroke-linejoin="round" />
                <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" letter-spacing="2.2">
                  <textPath href="#tgTextPath" startOffset="50%" text-anchor="middle">TAMISHNA GROUP</textPath>
                </text>
              </svg>
            </template>

            <!-- APP HEADER -->
            <header class="bg-slate-900 border-b border-slate-800 p-2.5 sticky top-0 z-30 flex justify-between items-center shadow-lg">
              <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-full bg-white p-0.5 flex items-center justify-center shadow-md flex-shrink-0" id="headerLogoSlot"></div>
                <div>
                  <h1 class="text-xs font-bold text-white tracking-wide">Tamishna Synthetics Ltd.</h1>
                  <p class="text-[9px] text-emerald-400 font-medium">Smart Attendance & Leave Portal</p>
                </div>
              </div>
              <div id="headerActions" class="hidden flex items-center space-x-2">
                <span id="headerName" class="text-[10px] text-slate-300 font-medium"></span>
                <button onclick="logout()" class="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg text-[10px] font-bold active:scale-95">লগআউট</button>
              </div>
            </header>

            <!-- 1. LOGIN SCREEN -->
            <main id="loginView" class="flex-1 p-4 max-w-sm mx-auto w-full flex flex-col justify-center">
              <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                <div class="text-center mb-5">
                  <div class="w-20 h-20 mx-auto bg-white rounded-full p-1 shadow-xl shadow-blue-900/30 mb-2.5" id="loginLogoSlot"></div>
                  <h2 class="text-base font-extrabold text-white">হাজিরা ও ছুটি পোর্টাল</h2>
                  <p class="text-[11px] text-emerald-400 font-medium">Tamishna Group &bull; Gazipur Plant</p>
                </div>

                <div id="loginAlert" class="hidden p-2.5 mb-4 rounded-xl text-xs text-center font-medium"></div>

                <form onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Card No / Employee ID</label>
                    <input type="text" id="loginId" required placeholder="যেমন: 10008895 বা 10000159" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 text-xs font-mono focus:outline-none focus:border-emerald-500">
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">গোপনীয় PIN</label>
                    <input type="password" id="loginPin" required maxlength="6" placeholder="••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 text-xs font-mono tracking-widest focus:outline-none focus:border-emerald-500">
                  </div>
                  <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 active:scale-95 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-500/25 text-xs mt-2">
                    লগইন করুন
                  </button>
                </form>

                <div class="mt-4 text-center">
                  <p class="text-[10px] text-slate-400">প্রথমবার লগইন করছেন? Card No এবং যেকোনো ৪-সংখ্যার PIN দিয়ে সাবমিট করলেই সেট হয়ে যাবে।</p>
                </div>
              </div>
            </main>

            <!-- 2. EMPLOYEE PUNCH SCREEN -->
            <main id="punchView" class="flex-1 p-4 max-w-md mx-auto w-full hidden flex flex-col justify-center space-y-4">
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-3 min-w-0">
                  <div class="w-12 h-12 rounded-full bg-white p-0.5 shadow flex-shrink-0" id="profileLogoSlot"></div>
                  <div class="min-w-0">
                    <h2 id="userName" class="text-sm font-bold text-white truncate"></h2>
                    <p class="text-[11px] text-slate-300 truncate" id="userDesig"></p>
                    <p class="text-[10px] text-emerald-400 font-mono mt-0.5">Card: <span id="userId" class="font-bold"></span> &bull; <span id="userSection"></span></p>
                  </div>
                </div>
                <button onclick="openLeaveApplyModal()" class="px-2.5 py-2 bg-blue-600/20 border border-blue-500/40 text-blue-300 rounded-xl text-[11px] font-bold active:scale-95 flex items-center space-x-1 flex-shrink-0">
                  <span>📝</span>
                  <span>ছুটির আবেদন</span>
                </button>
              </div>

              <!-- LIVE CLOCK -->
              <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 text-center shadow-lg">
                <p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold">Bangladesh Standard Time</p>
                <div id="clock" class="text-3xl font-mono font-extrabold text-emerald-400 my-1">--:--:--</div>
                <p id="dateStr" class="text-xs text-slate-300 font-medium"></p>
              </div>

              <div id="punchStatusAlert" class="p-3 bg-slate-900 rounded-xl text-xs text-center border border-slate-800 text-slate-300 font-medium">
                হাজিরা দিতে নিচের আঙ্গুলের ছাপ বাটনে চাপ দিন
              </div>

              <div class="grid grid-cols-2 gap-3 pt-1">
                <button onclick="handlePunch('CHECK_IN')" class="bg-emerald-600 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-emerald-500 text-center flex flex-col items-center">
                  <span class="text-2xl mb-1">👆</span>
                  <span class="text-xs font-bold">Fingerprint Check-In</span>
                </button>
                <button onclick="handlePunch('CHECK_OUT')" class="bg-rose-600 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-rose-500 text-center flex flex-col items-center">
                  <span class="text-2xl mb-1">🚪</span>
                  <span class="text-xs font-bold">Fingerprint Check-Out</span>
                </button>
              </div>

              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <p class="text-[10px] text-slate-400 uppercase font-semibold mb-1">আজকের হাজিরার তথ্য</p>
                <div class="flex justify-between text-xs text-slate-300">
                  <span>চেক-ইন: <b id="todayInText" class="text-emerald-400 font-mono">--:--</b></span>
                  <span>চেক-আউট: <b id="todayOutText" class="text-rose-400 font-mono">--:--</b></span>
                </div>
              </div>

              <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                <div class="flex justify-between items-center mb-2">
                  <p class="text-[10px] text-slate-400 uppercase font-semibold">আমার সাম্প্রতিক ছুটির আবেদন</p>
                  <span class="text-[10px] text-blue-400 font-mono cursor-pointer" onclick="openLeaveApplyModal()">+ নতুন আবেদন</span>
                </div>
                <div id="myLeaveList" class="space-y-2 text-xs"></div>
              </div>

              <div class="text-center pt-1">
                <button onclick="logout()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-semibold text-rose-400 active:scale-95">
                  লগআউট করুন (পরবর্তী কর্মীর জন্য)
                </button>
              </div>
            </main>

            <!-- 3. ADMIN PANEL SCREEN -->
            <main id="adminView" class="flex-1 p-4 max-w-2xl mx-auto w-full hidden space-y-4">
              <div class="flex justify-between items-center bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow">
                <div class="flex items-center space-x-2.5">
                  <div class="w-8 h-8 rounded-full bg-white p-0.5 shadow flex-shrink-0" id="adminLogoSlot"></div>
                  <div>
                    <h2 class="text-xs font-bold text-white">Mihir Roy Chowdhury (Admin)</h2>
                    <p class="text-[10px] text-emerald-400">Tamishna Synthetics Limited</p>
                  </div>
                </div>
                <div class="flex space-x-1.5">
                  <button onclick="exportAttendance()" class="bg-emerald-500 active:scale-95 text-slate-950 font-bold px-2.5 py-1.5 rounded-lg text-xs shadow flex items-center space-x-1">
                    <span>📊 হাজিরা Excel</span>
                  </button>
                  <button onclick="exportLeaveReport()" class="bg-blue-500 active:scale-95 text-slate-950 font-bold px-2.5 py-1.5 rounded-lg text-xs shadow flex items-center space-x-1">
                    <span>📝 ছুটির Excel</span>
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5 text-center">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">মোট কর্মী</span>
                  <p id="totalEmpCount" class="text-base font-bold text-white">51</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">আজ উপস্থিত</span>
                  <p id="todayPresentCount" class="text-base font-bold text-emerald-400">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <span class="text-[10px] text-slate-400 block">ছুটির আবেদন পেন্ডিং</span>
                  <p id="pendingLeaveBadge" class="text-base font-bold text-amber-400">0</p>
                </div>
              </div>

              <!-- ADMIN TABS -->
              <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                <button id="adminTabAtt" onclick="switchAdminTab('att')" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">দৈনিক হাজিরা লগ</button>
                <button id="adminTabLeave" onclick="switchAdminTab('leave')" class="flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1">
                  <span>ছুটি অনুমোদন (Leave)</span>
                  <span id="tabPendingBadge" class="hidden px-1.5 py-0.2 bg-amber-500 text-slate-950 text-[9px] rounded-full font-bold">0</span>
                </button>
                <button id="adminTabPin" onclick="switchAdminTab('pin')" class="flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white">PIN রিসেট</button>
              </div>

              <!-- VIEW A: ATTENDANCE TABLE -->
              <div id="adminAttSection" class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow">
                <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-xs">
                  <span class="text-slate-300 font-semibold">হাজিরা রেকর্ডস</span>
                  <button onclick="clearAllData()" class="text-rose-400 text-[10px] hover:underline">রেকর্ডস মুছুন</button>
                </div>
                <div class="overflow-x-auto max-h-96">
                  <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[9px] font-semibold sticky top-0">
                      <tr>
                        <th class="p-2.5">তারিখ</th>
                        <th class="p-2.5">কর্মী</th>
                        <th class="p-2.5">সেকশন</th>
                        <th class="p-2.5">ইন</th>
                        <th class="p-2.5">আউট</th>
                        <th class="p-2.5">স্ট্যাটাস</th>
                      </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800 font-mono text-[11px]"></tbody>
                  </table>
                </div>
              </div>

              <!-- VIEW B: LEAVE APPROVAL SECTION -->
              <div id="adminLeaveSection" class="hidden bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow">
                <div class="p-2.5 bg-slate-950 border-b border-slate-800 text-xs font-semibold text-slate-300">
                  কর্মকর্তা-কর্মচারীদের ছুটির আবেদনসমূহ (C/L, M/L, E/L)
                </div>
                <div id="adminLeaveCardsContainer" class="p-3 space-y-3"></div>
              </div>

              <!-- VIEW C: PIN MANAGEMENT SECTION -->
              <div id="adminPinSection" class="hidden bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow">
                <div class="p-2.5 bg-slate-950 border-b border-slate-800 text-xs font-semibold text-slate-300">
                  কর্মীদের গোপন PIN রিসেট তালিকা (কেউ পিন ভুলে গেলে এখান থেকে রিসেট করুন)
                </div>
                <div class="overflow-x-auto max-h-96">
                  <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[9px] font-semibold sticky top-0">
                      <tr>
                        <th class="p-2.5">Card No</th>
                        <th class="p-2.5">নাম ও সেকশন</th>
                        <th class="p-2.5">PIN স্ট্যাটাস</th>
                        <th class="p-2.5">অ্যাকশন</th>
                      </tr>
                    </thead>
                    <tbody id="adminPinTableBody" class="divide-y divide-slate-800 text-[11px]"></tbody>
                  </table>
                </div>
              </div>
            </main>

            <!-- 4. LEAVE APPLY MODAL -->
            <div id="leaveApplyModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
                <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                  <h3 class="text-sm font-bold text-white">ছুটির আবেদন ফর্ম</h3>
                  <button onclick="closeLeaveApplyModal()" class="text-slate-400 text-lg hover:text-white">&times;</button>
                </div>

                <form onsubmit="handleLeaveSubmit(event)" class="space-y-3 text-xs">
                  <div>
                    <label class="block text-slate-300 mb-1 font-semibold">ছুটির ধরন (Leave Type)</label>
                    <select id="leaveType" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-medium focus:outline-none focus:border-emerald-500">
                      <option value="C/L">C/L - Casual Leave (নৈমিত্তিক ছুটি)</option>
                      <option value="M/L">M/L - Medical Leave (চিকিৎসা ছুটি)</option>
                      <option value="E/L">E/L - Earned Leave (অর্জিত ছুটি)</option>
                    </select>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-slate-300 mb-1 font-semibold">হতে (From Date)</label>
                      <input type="date" id="leaveFrom" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                      <label class="block text-slate-300 mb-1 font-semibold">পর্যন্ত (To Date)</label>
                      <input type="date" id="leaveTo" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                  </div>

                  <div>
                    <label class="block text-slate-300 mb-1 font-semibold">ছুটির কারণ (Reason)</label>
                    <textarea id="leaveReason" required rows="2" placeholder="ছুটির বিস্তারিত কারণ লিখুন..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"></textarea>
                  </div>

                  <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeLeaveApplyModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg font-semibold">বাতিল</button>
                    <button type="submit" class="px-4 py-1.5 bg-blue-600 active:scale-95 text-white font-bold rounded-lg shadow">আবেদন জমা দিন</button>
                  </div>
                </form>
              </div>
            </div>

            <!-- 5. UNIVERSAL EXCEL EXPORT MODAL -->
            <div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                  <div class="flex items-center space-x-2">
                    <span class="text-xl">📊</span>
                    <h3 class="text-sm font-bold text-white" id="exportModalTitle">Excel রিপোর্ট ডাউনলোড ও শেয়ার</h3>
                  </div>
                  <button onclick="closeExportModal()" class="text-slate-400 text-xl hover:text-white">&times;</button>
                </div>

                <p class="text-xs text-slate-300">
                  নিচের যেকোনো সুবিধাজনক মাধ্যমে এক্সেল ডাটা ফোনে সেভ বা শেয়ার করুন:
                </p>

                <div class="space-y-2.5">
                  <button onclick="triggerNativeShare()" class="w-full p-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 rounded-xl text-left flex items-center space-x-3 transition shadow">
                    <span class="text-2xl">📲</span>
                    <div>
                      <div class="text-xs font-bold text-white">মোবাইলে সেভ / সরাসরি শেয়ার করুন</div>
                      <div class="text-[10px] text-emerald-100">WhatsApp, Drive, Gmail বা Files-এ পাঠান</div>
                    </div>
                  </button>

                  <button onclick="triggerDirectDownload()" class="w-full p-3 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-xl text-left flex items-center space-x-3 transition shadow">
                    <span class="text-2xl">📥</span>
                    <div>
                      <div class="text-xs font-bold text-white">সরাসরি ফাইল ডাউনলোড (.CSV / Excel)</div>
                      <div class="text-[10px] text-blue-100">মেমোরি কার্ড বা Downloads ফোল্ডারে নামবে</div>
                    </div>
                  </button>

                  <button onclick="triggerClipboardCopy()" class="w-full p-3 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-xl text-left flex items-center space-x-3 transition shadow">
                    <span class="text-2xl">📋</span>
                    <div>
                      <div class="text-xs font-bold text-emerald-400">এক ক্লিকে সম্পূর্ণ এক্সেল ডাটা কপি</div>
                      <div class="text-[10px] text-slate-400">কপি করে যেকোনো Excel বা Google Sheets-এ পেস্ট করুন</div>
                    </div>
                  </button>
                </div>

                <div class="border-t border-slate-800 pt-2">
                  <details class="text-xs text-slate-400">
                    <summary class="cursor-pointer text-[11px] text-slate-300 hover:underline">ডাটা প্রিভিউ দেখুন</summary>
