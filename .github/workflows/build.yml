              function buildDateWiseJobCard(empId, yearMonth) {
                const users = getUsers();
                const emp = users.find(u => u.id === empId);
                if (!emp) return null;

                const [year, month] = yearMonth.split('-').map(Number);
                const daysInMonth = new Date(year, month, 0).getDate();
                const records = getRecords();
                const leaves = getLeaves();

                const rows = [];
                let presentCount = 0;
                let leaveCount = 0;
                let weekendCount = 0;
                let absentCount = 0;

                const todayStr = new Date().toISOString().split('T')[0];

                for (let day = 1; day <= daysInMonth; day++) {
                  const dayStr = String(day).padStart(2, '0');
                  const dateStr = `${yearMonth}-${dayStr}`;
                  const dateObj = new Date(year, month - 1, day);
                  const dayName = dateObj.toLocaleDateString('bn-BD', { weekday: 'short' });
                  const isFriday = (dateObj.getDay() === 5); // Friday weekend

                  const attRecord = records.find(r => r.empId === empId && r.date === dateStr);
                  const leaveRecord = leaves.find(l => l.empId === empId && l.status === 'APPROVED' && dateStr >= l.fromDate && dateStr <= l.toDate);

                  let inTime = '--:--';
                  let outTime = '--:--';
                  let status = isFriday ? 'WEEKEND (শুক্রবার)' : 'ABSENT';

                  if (attRecord) {
                    inTime = attRecord.checkIn || '--:--';
                    outTime = attRecord.checkOut || '--:--';
                    status = 'PRESENT';
                    presentCount++;
                  } else if (leaveRecord) {
                    status = `LEAVE (${leaveRecord.type})`;
                    leaveCount++;
                  } else if (isFriday) {
                    status = 'WEEKEND';
                    weekendCount++;
                  } else if (dateStr <= todayStr) {
                    absentCount++;
                  } else {
                    status = 'UPCOMING';
                  }

                  rows.push({
                    date: dateStr,
                    day: dayName,
                    inTime: inTime,
                    outTime: outTime,
                    status: status
                  });
                }

                return {
                  emp: emp,
                  month: yearMonth,
                  rows: rows,
                  stats: {
                    totalDays: daysInMonth,
                    present: presentCount,
                    leave: leaveCount,
                    weekend: weekendCount,
                    absent: absentCount
                  }
                };
              }

