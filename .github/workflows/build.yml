              function getPinVault() { return JSON.parse(localStorage.getItem('tsl_pins_v60') || '{}'); }
              function savePinVault(v) { localStorage.setItem('tsl_pins_v60', JSON.stringify(v)); }

              function getBstDateStr(d = new Date()) {
                const bst = new Date(d.getTime() + (6 * 60 + d.getTimezoneOffset()) * 60000);
                const y = bst.getFullYear();
                const m = String(bst.getMonth() + 1).padStart(2, '0');
                const day = String(bst.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
              }

              async function hashPin(pin) {
                const encoder = new TextEncoder();
                const data = encoder.encode(pin + "_tsl_secure_salt_2026");
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
              }

              function loadRememberedCredentials() {
                const isRemembered = localStorage.getItem('tsl_remember_active') === 'true';
                const saved = localStorage.getItem('tsl_remembered_cred');
                if (isRemembered && saved) {
                  try {
                    const cred = JSON.parse(saved);
                    document.getElementById('loginId').value = cred.id || '';
                    document.getElementById('loginPin').value = cred.pin || '';
                    document.getElementById('rememberPinCheckbox').checked = true;
                  } catch(e) {}
                } else {
                  document.getElementById('loginId').value = '';
                  document.getElementById('loginPin').value = '';
                  document.getElementById('rememberPinCheckbox').checked = false;
                }
              }

              function handleRememberPinSave(id, pin) {
                const isChecked = document.getElementById('rememberPinCheckbox').checked;
                if (isChecked) {
                  localStorage.setItem('tsl_remember_active', 'true');
                  localStorage.setItem('tsl_remembered_cred', JSON.stringify({ id, pin }));
                } else {
                  localStorage.setItem('tsl_remember_active', 'false');
                  localStorage.removeItem('tsl_remembered_cred');
                }
              }

              // ============================================================
              // 2. ULTRA-FAST ASYNC CLOUD SHEET CALL (NON-BLOCKING)
              // ============================================================
              const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbyArqQrKOY5p3T6ACEMlLPiYaCv1umVOB6uudbLnU_-pC6T_IKv8uN_8XkZPG_OZf6A/exec';
              let centralSyncInterval = null;

              async function callGoogleSheet(params = {}) {
                const query = new URLSearchParams(params).toString();
                const fullUrl = `${GOOGLE_SHEET_API_URL}?${query}`;
                try {
                  const res = await fetch(fullUrl, { method: 'GET', redirect: 'follow' });
                  if (res.ok) {
                    return await res.json();
                  }
                } catch(e) {
                  console.warn('Google Sheet call error', e);
                }
                return null;
              }

              async function pushPunchToCloud(record) {
                const res = await callGoogleSheet({ action: 'punch', data: JSON.stringify(record) });
                return res && res.status === 'success';
              }

              async function deleteFromCloud(recordId) {
                await callGoogleSheet({ action: 'deleteRecord', id: recordId });
              }

              async function clearCloudDatabase() {
                await callGoogleSheet({ action: 'clearAll' });
              }

              async function pullAllFromCloud(showAlert = false) {
                const res = await callGoogleSheet({ action: 'getRecords' });
                if (res && res.status === 'success') {
                  if (Array.isArray(res.records)) {
                    res.records.sort((a,b) => (b.date + (b.checkIn||'')).localeCompare(a.date + (a.checkIn||'')));
                    saveRecords(res.records);
                  }
                  if (Array.isArray(res.leaves)) {
                    saveLeaves(res.leaves);
                  }
                  if (res.pins && typeof res.pins === 'object') {
                    savePinVault(res.pins);
                  }
                  // AUTO MERGE CLOUD REGISTERED EMPLOYEES
                  if (Array.isArray(res.employees) && res.employees.length > 0) {
                    let currentUsers = getUsers();
                    let map = new Map();
                    TAMISHNA_EMPLOYEES.forEach(u => map.set(String(u.id).trim(), u));
                    currentUsers.forEach(u => map.set(String(u.id).trim(), u));
                    res.employees.forEach(u => map.set(String(u.id).trim(), u));
                    const merged = Array.from(map.values());
                    saveUsers(merged);
                  }
                  if (showAlert) alert('✓ Connected to Google Sheet! Live data synced.');
                  if (currentUser && currentUser.role === 'ADMIN') {
                    loadAdminDashboard();
                    populateJobCardEmpDropdown();
                    if (currentJobCardData && currentJobCardData.emp) {
                      renderSelectedEmployeeJobCard();
                    }
                  }
                  return;
                }
                if (showAlert) alert('Google Sheet sync check completed.');
              }

