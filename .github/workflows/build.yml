              // ============================================================
              // 3. HARDWARE BIOMETRIC PROMPT SENSOR INTEGRATION
              // ============================================================
              function triggerBiometricAuth(actionType) {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => r.empId === currentUser.id && r.date === today);

                // PRE-VALIDATION BEFORE CALLING HARDWARE SENSOR
                if (actionType === 'CHECK_IN') {
                  if (existingIndex !== -1) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ ডুপ্লিকেট পাঞ্চ বাতিল! অলরেডি ইন করেছেন (' + records[existingIndex].checkIn + ')</span>';
                    return;
                  }
                } else {
                  if (existingIndex === -1) {
                    alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ আগে চেক-ইন (Check-In) করতে হবে!</span>';
                    return;
                  }
                  if (records[existingIndex].checkOut) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ আজকের শিফট অলরেডি শেষ হয়েছে (' + records[existingIndex].checkOut + ')</span>';
                    return;
                  }
                }

                alertEl.innerHTML = '<span class="text-blue-400 font-medium animate-pulse">অনুগ্রহ করে আপনার ফোনের ফিঙ্গারপ্রিন্ট সেন্সরে আঙ্গুল ছোঁয়ান...</span>';

                // TRIGGER OFFICIAL NATIVE ANDROID BIOMETRIC SENSOR DIALOG
                if (window.AndroidBiometric && window.AndroidBiometric.authenticate) {
                  window.AndroidBiometric.authenticate(actionType);
                } else {
                  // Fallback simulation for desktop browser testing
                  const confirmed = confirm("[Hardware Sensor Simulator]\nTamishna Synthetics Attendance\n\nআঙ্গুলের ছাপ ভেরিফাই করতে 'OK' চাপুন।");
                  if (confirmed) {
                    onBiometricSuccess(actionType);
                  } else {
                    onBiometricError("ভেরিফিকেশন বাতিল করা হয়েছে");
                  }
                }
              }

              // NATIVE ANDROID CALLBACKS
              window.onBiometricSuccess = function(actionType) {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => r.empId === currentUser.id && r.date === today);

                const punchRecord = {
                  id: 'REC-' + Date.now(),
                  date: today,
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  checkIn: actionType === 'CHECK_IN' ? timeStr : (records[existingIndex] ? records[existingIndex].checkIn : timeStr),
                  checkOut: actionType === 'CHECK_OUT' ? timeStr : null,
                  status: 'PRESENT (Sensor Verified)'
                };

                if (actionType === 'CHECK_IN') {
                  records.unshift(punchRecord);
                  saveRecords(records);
                  pushPunchToCloud(punchRecord);
                  alertEl.innerHTML = '<span class="text-emerald-400 font-bold">✓ ফিঙ্গারপ্রিন্ট সেন্সর ভেরিফাইড! চেক-ইন হয়েছে (' + timeStr + ')</span>';
                } else {
                  records[existingIndex].checkOut = timeStr;
                  saveRecords(records);
                  pushPunchToCloud(records[existingIndex]);
                  alertEl.innerHTML = '<span class="text-rose-400 font-bold">✓ ফিঙ্গারপ্রিন্ট সেন্সর ভেরিফাইড! চেক-আউট হয়েছে (' + timeStr + ')</span>';
                }
                refreshEmployeeTodayPunch();
              };

              window.onBiometricFailed = function() {
                const alertEl = document.getElementById('punchStatusAlert');
                alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ আঙ্গুলের ছাপ মেলেনি! আবার সঠিক আঙ্গুল সেন্সরে রাখুন।</span>';
              };

              window.onBiometricError = function(errMsg) {
                const alertEl = document.getElementById('punchStatusAlert');
                alertEl.innerHTML = '<span class="text-amber-400">⚠️ সেন্সর ভেরিফিকেশন বাতিল বা ত্রুটি: ' + errMsg + '</span>';
              };

              // 4. ADVANCED PDF 'SAVE AS' GENERATOR
              let activePdfDoc = null;
              let activePdfFilename = '';

              function buildPdfDocument() {
                const records = getRecords();
                if (records.length === 0) return null;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'pt', 'a4');

                doc.setFillColor(12, 65, 130);
                doc.rect(0, 0, 595.28, 65, 'F');

                doc.setTextColor(255, 255, 255);
                doc.setFontSize(16);
                doc.setFont('helvetica', 'bold');
                doc.text('TAMISHNA SYNTHETICS LIMITED', 40, 30);

                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text('Industrial Attendance & Shift Log Report (Biometric Sensor)', 40, 48);

                doc.setTextColor(50, 50, 50);
                doc.setFontSize(9);
                doc.text('Generated By: Mihir Roy Chowdhury (Admin)', 40, 85);
                doc.text('Plant: Gazipur Factory | Hardware Biometric Verified', 40, 98);
                doc.text('Total Punches: ' + records.length, 440, 85);
                doc.text('Report Date: ' + new Date().toLocaleDateString(), 440, 98);

                const tableRows = records.map(r => [
                  r.date,
                  r.empId,
                  r.name,
                  r.section || 'General',
                  r.checkIn || '--:--',
                  r.checkOut || '--:--',
                  r.status
                ]);

                doc.autoTable({
                  startY: 115,
                  head: [['Date', 'Card No', 'Employee Name', 'Section', 'Check-In', 'Check-Out', 'Status']],
                  body: tableRows,
                  theme: 'striped',
                  headStyles: {
                    fillColor: [12, 65, 130],
                    textColor: [255, 255, 255],
                    fontSize: 8,
                    fontStyle: 'bold'
                  },
                  bodyStyles: { fontSize: 8, textColor: [40, 40, 40] },
                  alternateRowStyles: { fillColor: [245, 247, 250] },
                  margin: { left: 40, right: 40 }
                });

                return doc;
              }

              function openPDFExportModal() {
                const records = getRecords();
                if (records.length === 0) {
                  alert('ডাউনলোড করার মতো কোনো হাজিরার ডাটা নেই!');
                  return;
                }
                activePdfDoc = buildPdfDocument();
                activePdfFilename = 'Tamishna_Attendance_' + new Date().toISOString().split('T')[0] + '.pdf';
                document.getElementById('pdfExportModal').classList.remove('hidden');
              }
              function closePDFExportModal() {
                document.getElementById('pdfExportModal').classList.add('hidden');
              }

              async function savePDFWithSaveAs() {
                if (!activePdfDoc) return;
                const pdfBlob = activePdfDoc.output('blob');

                if (window.showSaveFilePicker) {
                  try {
                    const handle = await window.showSaveFilePicker({
                      suggestedName: activePdfFilename,
                      types: [{ description: 'PDF Document', accept: { 'application/pdf': ['.pdf'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(pdfBlob);
                    await writable.close();
                    alert('✓ আপনার নির্বাচিত ফোল্ডারে PDF সফলভাবে সেভ হয়েছে!');
                    closePDFExportModal();
                    return;
                  } catch(e) {}
                }

                if (navigator.canShare) {
                  try {
                    const file = new File([pdfBlob], activePdfFilename, { type: 'application/pdf' });
                    if (navigator.canShare({ files: [file] })) {
                      await navigator.share({
                        title: 'Tamishna Attendance PDF Report',
                        files: [file]
                      });
                      closePDFExportModal();
                      return;
                    }
                  } catch(e) {}
                }

                savePDFDirectDownload();
              }

              function savePDFViaSystemPrint() {
                if (!activePdfDoc) return;
                const pdfUrl = activePdfDoc.output('bloburl');
                const printWindow = window.open(pdfUrl, '_blank');
                if (printWindow) {
                  printWindow.focus();
                } else {
                  savePDFDirectDownload();
                }
              }

              function savePDFDirectDownload() {
                if (!activePdfDoc) return;
                activePdfDoc.save(activePdfFilename);
                alert('✓ Downloads ফোল্ডারে PDF ফাইলটি সেভ হয়েছে!');
                closePDFExportModal();
              }

              // 5. FRESH SIGN UP & FORM RESET
