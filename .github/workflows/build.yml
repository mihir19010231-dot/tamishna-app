          }

          def create_tamishna_icon(sz):
              img = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              draw.ellipse([sz*0.03, sz*0.03, sz*0.97, sz*0.97], fill='#0c4182')
              draw.ellipse([sz*0.17, sz*0.17, sz*0.83, sz*0.83], fill='#ffffff', outline='#0c4182', width=max(1, int(sz*0.025)))

              top_w = sz * 0.46
              top_h = sz * 0.12
              top_x = (sz - top_w) / 2
              top_y = sz * 0.30
              draw.rectangle([top_x, top_y, top_x + top_w, top_y + top_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              stem_w = sz * 0.22
              stem_h = sz * 0.32
              stem_x = (sz - stem_w) / 2
              stem_y = top_y + top_h - 1
              draw.rectangle([stem_x, stem_y, stem_x + stem_w, stem_y + stem_h], fill='#f26522', outline='#0c4182', width=max(1, int(sz*0.02)))

              return img

          res_path = 'tamishna/android/app/src/main/res'
          for folder, size in sizes.items():
              target_dir = os.path.join(res_path, folder)
              os.makedirs(target_dir, exist_ok=True)
              icon = create_tamishna_icon(size)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          xml_folder = os.path.join(res_path, 'mipmap-anydpi-v26')
          if os.path.exists(xml_folder):
              import shutil
              shutil.rmtree(xml_folder)
          print("✓ Official Tamishna Group App Launcher Icons generated successfully!")
          EOF

      # BUILD PRODUCTION RELEASE SIGNED APK
      - name: Build Production Signed Release APK
        run: |
          cd tamishna/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # RE-SIGN AND ALIGN USING APKSIGNER (V1, V2, V3 SCHEMES FOR ZERO PLAY PROTECT BLOCK)
      - name: Align and Sign with Apksigner
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"
          
          mkdir -p output_apk
          ORIGINAL_APK="tamishna/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$ORIGINAL_APK" ]; then
            ORIGINAL_APK="tamishna/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$ORIGINAL_APK" "output_apk/aligned.apk"
          
          $BUILD_TOOLS_DIR/apksigner sign --ks tamishna/android/release.keystore \
            --ks-pass pass:tamishna123 \
            --ks-key-alias tamishna \
            --key-pass pass:tamishna123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "output_apk/Tsl attendance.apk" "output_apk/aligned.apk"

          $BUILD_TOOLS_DIR/apksigner verify --verbose "output_apk/Tsl attendance.apk"
          echo "✓ Verified official v1, v2 & v3 signatures successfully!"

      # UPLOAD DIRECT PRODUCTION SIGNED APK
      - name: Upload Tsl attendance.apk
        uses: actions/upload-artifact@v4
        with:
          name: Tsl-attendance-v6.0
          path: "output_apk/Tsl attendance.apk"