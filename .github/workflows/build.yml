                { id: "10004802", pin: "4802", name: "Md. Imon Khan", desig: "Executive", section: "Quality Control", role: "EMPLOYEE" },
                { id: "10005285", pin: "5258", name: "Md. Habibur Rahman Badhan", desig: "Asst. Executive", section: "Twisting", role: "EMPLOYEE" },
                { id: "10005288", pin: "5288", name: "Md. Rejaul Islam", desig: "Asst. Executive", section: "Back Process", role: "EMPLOYEE" },
                { id: "10005672", pin: "5672", name: "Shahabul Islam", desig: "Jr. Executive", section: "Human Resource", role: "EMPLOYEE" },
                { id: "10007832", pin: "7832", name: "Rabiul Hasan", desig: "Executive", section: "Research And Development", role: "EMPLOYEE" },
                { id: "10008119", pin: "8119", name: "Md. Wahidur Rahman", desig: "Asst. Manager", section: "Ring", role: "EMPLOYEE" },
                { id: "10009570", pin: "9570", name: "Rakibul Hasan", desig: "Asst. Executive", section: "Ring", role: "EMPLOYEE" },
                { id: "10009796", pin: "9796", name: "Md. Abdul Aual", desig: "Executive", section: "Maintenance", role: "EMPLOYEE" }
              ];

              localStorage.setItem('tsl_users_v3', JSON.stringify(TAMISHNA_EMPLOYEES));

              function getUsers() {
                return JSON.parse(localStorage.getItem('tsl_users_v3'));
              }
              function getRecords() {
                return JSON.parse(localStorage.getItem('tsl_records_v3') || '[]');
              }
              function saveRecords(data) {
                localStorage.setItem('tsl_records_v3', JSON.stringify(data));
              }

              // LEAVE DATABASE ACCESS
              function getLeaves() {
                return JSON.parse(localStorage.getItem('tsl_leaves_v3') || '[]');
              }
              function saveLeaves(data) {
                localStorage.setItem('tsl_leaves_v3', JSON.stringify(data));
              }

              let currentUser = null;

              // CLOCK
              function tick() {
                const now = new Date();
                const clockEl = document.getElementById('clock');
                if (clockEl) clockEl.innerText = now.toLocaleTimeString();
                const dateEl = document.getElementById('dateStr');
                if (dateEl) dateEl.innerText = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
              }
              setInterval(tick, 1000);
              tick();

              // LOGIN
              function handleLogin(e) {
                e.preventDefault();
                const idInput = document.getElementById('loginId').value.trim();
                const pinInput = document.getElementById('loginPin').value.trim();
                const alertEl = document.getElementById('loginAlert');
                alertEl.classList.add('hidden');

                const users = getUsers();
                const found = users.find(u => u.id === idInput && u.pin === pinInput);

                if (!found) {
                  alertEl.innerText = 'ভুল Card No অথবা PIN! সঠিক তথ্য দিন।';
                  alertEl.classList.remove('hidden');
                  return;
                }

                currentUser = found;
                document.getElementById('loginId').value = '';
                document.getElementById('loginPin').value = '';
                showAppScreen();
              }

              function showAppScreen() {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('headerActions').classList.remove('hidden');
                document.getElementById('headerName').innerText = currentUser.name.split(' ')[0];

                if (currentUser.role === 'ADMIN') {
                  document.getElementById('punchView').classList.add('hidden');
                  document.getElementById('adminView').classList.remove('hidden');
                  loadAdminDashboard();
                } else {
                  document.getElementById('adminView').classList.add('hidden');
                  document.getElementById('punchView').classList.remove('hidden');
                  document.getElementById('userName').innerText = currentUser.name;
                  document.getElementById('userDesig').innerText = currentUser.desig;
                  document.getElementById('userId').innerText = currentUser.id;
                  document.getElementById('userSection').innerText = currentUser.section;
                  document.getElementById('userInitial').innerText = currentUser.name.charAt(0);
                  refreshEmployeeTodayPunch();
                  loadMyLeaves();
                }
              }

              function logout() {
                currentUser = null;
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('punchView').classList.add('hidden');
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('headerActions').classList.add('hidden');
                document.getElementById('punchStatusAlert').innerText = 'হাজিরা দিতে নিচের আঙ্গুলের ছাপ বাটনে চাপ দিন';
              }

              // PUNCH HANDLING
              function refreshEmployeeTodayPunch() {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const records = getRecords();
                const record = records.find(r => r.empId === currentUser.id && r.date === today);
                document.getElementById('todayInText').innerText = record ? record.checkIn : '--:--';
                document.getElementById('todayOutText').innerText = (record && record.checkOut) ? record.checkOut : '--:--';
                
                // CHECK IF TODAY ON APPROVED LEAVE
                const leaves = getLeaves();
                const approvedToday = leaves.find(l => l.empId === currentUser.id && l.status === 'APPROVED' && today >= l.fromDate && today <= l.toDate);
                if (approvedToday) {
                  document.getElementById('punchStatusAlert').innerHTML = '<span class="text-blue-400 font-bold">ℹ️ আপনি আজ অনুমোদিত ছুটিতে আছেন (' + approvedToday.type + ')</span>';
                }
              }

              function handlePunch(type) {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => r.empId === currentUser.id && r.date === today);

                if (type === 'CHECK_IN') {
                  if (existingIndex !== -1) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ ডুপ্লিকেট পাঞ্চ বাতিল! অলরেডি ইন করেছেন (' + records[existingIndex].checkIn + ')</span>';
                    return;
                  }
                  records.unshift({
                    id: 'REC-' + Date.now(),
                    date: today,
                    empId: currentUser.id,
                    name: currentUser.name,
                    desig: currentUser.desig,
                    section: currentUser.section,
                    checkIn: timeStr,
                    checkOut: null,
                    status: 'PRESENT'
                  });
                  saveRecords(records);
                  alertEl.innerHTML = '<span class="text-emerald-400 font-bold">✓ ফিঙ্গারপ্রিন্ট ভেরিফাইড! চেক-ইন হয়েছে (' + timeStr + ')</span>';
                } else {
                  if (existingIndex === -1) {
                    alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ আগে চেক-ইন (Check-In) করতে হবে!</span>';
                    return;
                  }
                  if (records[existingIndex].checkOut) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ আজকের শিফট শেষ হয়েছে (' + records[existingIndex].checkOut + ')</span>';
                    return;
                  }
                  records[existingIndex].checkOut = timeStr;
                  saveRecords(records);
                  alertEl.innerHTML = '<span class="text-rose-400 font-bold">✓ ফিঙ্গারপ্রিন্ট ভেরিফাইড! চেক-আউট হয়েছে (' + timeStr + ')</span>';
                }
                refreshEmployeeTodayPunch();
              }

              // LEAVE MODAL & APPLY LOGIC
              function openLeaveApplyModal() {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('leaveFrom').value = today;
                document.getElementById('leaveTo').value = today;
                document.getElementById('leaveReason').value = '';
                document.getElementById('leaveApplyModal').classList.remove('hidden');
              }
              function closeLeaveApplyModal() {
                document.getElementById('leaveApplyModal').classList.add('hidden');
              }

              function handleLeaveSubmit(e) {
                e.preventDefault();
                if (!currentUser) return;
                const type = document.getElementById('leaveType').value;
                const fromDate = document.getElementById('leaveFrom').value;
                const toDate = document.getElementById('leaveTo').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (fromDate > toDate) {
                  alert('শুরুর তারিখ শেষের তারিখের চেয়ে বড় হতে পারবে না!');
                  return;
                }

                const leaves = getLeaves();
                leaves.unshift({
                  id: 'LV-' + Date.now(),
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: new Date().toLocaleDateString('bn-BD') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  status: 'PENDING'
                });
                saveLeaves(leaves);
                closeLeaveApplyModal();
                alert('ছুটির আবেদন সফলভাবে জমা হয়েছে! এডমিন অনুমোদনের পর এটি কার্যকর হবে।');
                loadMyLeaves();
              }

              function loadMyLeaves() {
                if (!currentUser) return;
                const leaves = getLeaves().filter(l => l.empId === currentUser.id);
                const container = document.getElementById('myLeaveList');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-2">কোনো আবেদন করা হয়নি</p>';
                  return;
                }
                container.innerHTML = leaves.slice(0, 3).map(l => {
                  let badge = l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                              'bg-amber-500/20 text-amber-300 border-amber-500/40';
                  let statusText = l.status === 'APPROVED' ? 'অনুমোদিত' : l.status === 'REJECTED' ? 'বাতিল' : 'অপেক্ষারত';
                  return `
                    <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
                      <div>
                        <div class="flex items-center space-x-1.5">
                          <b class="text-white">${l.type}</b>
                          <span class="text-slate-400 text-[10px]">(${l.fromDate} থেকে ${l.toDate})</span>
                        </div>
                        <p class="text-slate-400 text-[10px] truncate max-w-[200px] mt-0.5">${l.reason}</p>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badge}">${statusText}</span>
                    </div>
                  `;
                }).join('');
              }

              // ADMIN DASHBOARD & APPROVAL
              function switchAdminTab(tab) {
                if (tab === 'att') {
                  document.getElementById('adminAttSection').classList.remove('hidden');
                  document.getElementById('adminLeaveSection').classList.add('hidden');
                  document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1';
                } else {
                  document.getElementById('adminAttSection').classList.add('hidden');
                  document.getElementById('adminLeaveSection').classList.remove('hidden');
                  document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center space-x-1';
                  document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                  loadAdminLeaveCards();
                }
              }

              function loadAdminDashboard() {
                const records = getRecords();
                const today = new Date().toISOString().split('T')[0];
                const todayRecords = records.filter(r => r.date === today);
                const leaves = getLeaves();
                const pendingLeaves = leaves.filter(l => l.status === 'PENDING');

                document.getElementById('totalEmpCount').innerText = getUsers().length;
                document.getElementById('todayPresentCount').innerText = todayRecords.length;
                document.getElementById('pendingLeaveBadge').innerText = pendingLeaves.length;

                const tabBadge = document.getElementById('tabPendingBadge');
                if (pendingLeaves.length > 0) {
                  tabBadge.innerText = pendingLeaves.length;
                  tabBadge.classList.remove('hidden');
                } else {
                  tabBadge.classList.add('hidden');
                }

                // Attendance Table
                const tbody = document.getElementById('adminTableBody');
                if (records.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500 font-sans">কোনো হাজিরার তথ্য নেই</td></tr>';
                } else {
                  tbody.innerHTML = records.map(r => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="p-2.5 text-slate-400">${r.date}</td>
                      <td class="p-2.5 font-sans font-bold text-white">${r.name}<br><span class="text-[9px] font-mono text-emerald-400">${r.empId}</span></td>
                      <td class="p-2.5 text-slate-300 font-sans">${r.section}</td>
                      <td class="p-2.5 text-emerald-400 font-bold">${r.checkIn}</td>
                      <td class="p-2.5 text-rose-400 font-bold">${r.checkOut || '--:--'}</td>
                      <td class="p-2.5 font-sans"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300">${r.status}</span></td>
                    </tr>
                  `).join('');
                }

                loadAdminLeaveCards();
              }

              function loadAdminLeaveCards() {
                const leaves = getLeaves();
                const container = document.getElementById('adminLeaveCardsContainer');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-6">কোনো ছুটির আবেদন জমা পড়েনি</p>';
                  return;
                }
                container.innerHTML = leaves.map(l => {
                  let badge = l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                              'bg-amber-500/20 text-amber-300 border-amber-500/40';
                  let statusTitle = l.status === 'APPROVED' ? 'অনুমোদিত' : l.status === 'REJECTED' ? 'বাতিল' : 'অপেক্ষারত';

                  let actionBtns = '';
                  if (l.status === 'PENDING') {
                    actionBtns = `
                      <div class="flex space-x-2 pt-2 border-t border-slate-800">
                        <button onclick="updateLeaveStatus('${l.id}', 'APPROVED')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✓ অনুমোদন করুন (Approve)</button>
                        <button onclick="updateLeaveStatus('${l.id}', 'REJECTED')" class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✗ প্রত্যাখ্যান (Reject)</button>
                      </div>
                    `;
                  }

                  return `
                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                      <div class="flex justify-between items-start">
                        <div>
                          <h4 class="font-bold text-white text-xs">${l.name} <span class="text-emerald-400 font-mono">(${l.empId})</span></h4>
                          <p class="text-[10px] text-slate-400">${l.desig} &bull; ${l.section}</p>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badge}">${statusTitle} (${l.type})</span>
                      </div>
                      <div class="text-[11px] bg-slate-900 p-2 rounded border border-slate-800/80">
                        <p class="text-slate-300"><b>সময়সীমা:</b> ${l.fromDate} হতে ${l.toDate}</p>
                        <p class="text-slate-300 mt-0.5"><b>কারণ:</b> ${l.reason}</p>
                        <p class="text-[9px] text-slate-500 mt-1">আবেদনের সময়: ${l.appliedOn}</p>
                      </div>
                      ${actionBtns}
                    </div>
                  `;
                }).join('');
              }

              function updateLeaveStatus(leaveId, newStatus) {
                let leaves = getLeaves();
                let foundIndex = leaves.findIndex(l => l.id === leaveId);
                if (foundIndex === -1) return;

                leaves[foundIndex].status = newStatus;
                saveLeaves(leaves);

                // IF APPROVED, ALSO CREATE ATTENDANCE ENTRY WITH LEAVE TYPE
                if (newStatus === 'APPROVED') {
                  const targetLeave = leaves[foundIndex];
                  let records = getRecords();
                  records.unshift({
                    id: 'REC-LV-' + Date.now(),
                    date: targetLeave.fromDate,
                    empId: targetLeave.empId,
                    name: targetLeave.name,
                    desig: targetLeave.desig,
                    section: targetLeave.section,
                    checkIn: 'LEAVE',
                    checkOut: targetLeave.type,
                    status: 'ON LEAVE (' + targetLeave.type + ')'
                  });
                  saveRecords(records);
                }

                alert(newStatus === 'APPROVED' ? 'ছুটি সফলভাবে অনুমোদন করা হয়েছে!' : 'ছুটির আবেদন প্রত্যাখ্যান করা হয়েছে।');
                loadAdminDashboard();
              }

              // EXPORT EXCEL (CSV)
              function exportCSV() {
                const records = getRecords();
                if (records.length === 0) {
                  alert('ডাউনলোড করার মতো হাজিরার ডাটা নেই!');
                  return;
                }
                let csv = 'Record ID,Date,Card No,Name,Designation,Section,Check-In,Check-Out,Status\n';
                records.forEach(r => {
                  csv += `"${r.id}","${r.date}","${r.empId}","${r.name}","${r.desig}","${r.section}","${r.checkIn}","${r.checkOut || ''}","${r.status}"\n`;
                });
                downloadCSV(csv, `Tamishna_Attendance_${new Date().toISOString().split('T')[0]}.csv`);
              }

              function exportLeaveCSV() {
                const leaves = getLeaves();
                if (leaves.length === 0) {
                  alert('ডাউনলোড করার মতো কোনো ছুটির ডাটা নেই!');
                  return;
                }
                let csv = 'Leave ID,Card No,Name,Designation,Section,Type,From Date,To Date,Reason,Status,Applied On\n';
                leaves.forEach(l => {
                  csv += `"${l.id}","${l.empId}","${l.name}","${l.desig}","${l.section}","${l.type}","${l.fromDate}","${l.toDate}","${l.reason}","${l.status}","${l.appliedOn}"\n`;
                });
                downloadCSV(csv, `Tamishna_Leave_Report_${new Date().toISOString().split('T')[0]}.csv`);
              }

              function downloadCSV(csvContent, filename) {
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              }

              function clearAllData() {
                if (confirm('আপনি কি সমস্ত হাজিরার ডাটা মুছে ফেলতে চান?')) {
                  localStorage.removeItem('tsl_records_v3');
                  loadAdminDashboard();
                }
              }
            </script>
          </body>
          </html>
          EOF
          npx cap init "Tamishna Attendance" "com.tamishna.synthetics.attendance" --web-dir dist
          npx cap add android

      - name: Build Debug APK
        run: |
          cd tamishna/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamishna-Attendance-APK
          path: tamishna/android/app/build/outputs/apk/debug/*.apk