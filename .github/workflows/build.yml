              function buildDateWiseJobCard(empId, yearMonth) {
                const users = getUsers();
                const emp = users.find(u => String(u.id).trim() === String(empId).trim());
                if (!emp) return null;

                const [year, month] = yearMonth.split('-').map(Number);
                const daysInMonth = new Date(year, month, 0).getDate();
                const records = getRecords();
                const leaves = getLeaves();

                const rows = [];
                let presentCount = 0;
                let leaveCount = 0;
                let weekendCount = 0;
                let absentCount = 0;

                const todayStr = getBstDateStr();

                for (let day = 1; day <= daysInMonth; day++) {
                  const dayStr = String(day).padStart(2, '0');
                  const dateStr = `${yearMonth}-${dayStr}`;
                  const dateObj = new Date(year, month - 1, day);
                  const isFriday = (dateObj.getDay() === 5);

                  const attRecord = records.find(r => String(r.empId).trim() === String(empId).trim() && String(r.date).trim() === dateStr);
                  const approvedLeave = leaves.find(l => String(l.empId).trim() === String(empId).trim() && 
                    l.status === 'APPROVED' && 
                    dateStr >= String(l.fromDate).trim() && dateStr <= String(l.toDate).trim());

                  let inTime = '--:--';
                  let outTime = '--:--';
                  let status = isFriday ? 'WEEKEND' : 'ABSENT';

                  if (attRecord && attRecord.status !== 'ABSENT') {
                    inTime = attRecord.checkIn || '--:--';
                    outTime = attRecord.checkOut || '--:--';
                    status = 'PRESENT';
                    presentCount++;
                  } else if (approvedLeave) {
                    status = `LEAVE (${approvedLeave.type})`;
                    leaveCount++;
                  } else if (isFriday) {
                    status = 'WEEKEND';
                    weekendCount++;
                  } else if (dateStr <= todayStr) {
                    absentCount++;
                  } else {
                    status = 'UPCOMING';
                  }

                  rows.push({
                    date: dateStr,
                    inTime: inTime,
                    outTime: outTime,
                    status: status
                  });
                }

                return {
                  emp: emp,
                  month: yearMonth,
                  rows: rows,
                  stats: {
                    totalDays: daysInMonth,
                    present: presentCount,
                    leave: leaveCount,
                    weekend: weekendCount,
                    absent: absentCount
                  }
                };
              }

