              async function triggerNativeShare() {
                const { csv, filename, title } = activeExportPayload;
                try {
                  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                  const file = new File([blob], filename, { type: 'text/csv' });

                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      title: title,
                      text: 'Tamishna Synthetics Limited Attendance Report',
                      files: [file]
                    });
                    return;
                  }
                } catch (e) {
                  console.log('File share fallback', e);
                }

                if (navigator.share) {
                  try {
                    await navigator.share({ title: title, text: csv });
                    return;
                  } catch (e) {
                    console.log('Share cancel', e);
                  }
                }
                triggerDirectDownload();
              }

              function triggerDirectDownload() {
                const { csv, filename } = activeExportPayload;
                try {
                  const encodedUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
                  const a = document.createElement('a');
                  a.setAttribute('href', encodedUri);
                  a.setAttribute('download', filename);
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  alert('ফাইল ডাউনলোড সফল হয়েছে! Downloads ফোল্ডার চেক করুন।');
                } catch (e) {
                  alert('ব্রাউজার ডাউনলোড ব্লক করেছে। "কপি করুন" বাটনটি ব্যবহার করুন।');
                }
              }

              function triggerClipboardCopy() {
                const { csv } = activeExportPayload;
                const tsv = csv.split('\n').map(row => {
                  return row.split(',').map(cell => cell.replace(/^"|"$/g, '')).join('\t');
                }).join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(tsv).then(() => {
                    alert('✓ সম্পূর্ণ এক্সেল ডাটা সফলভাবে কপি হয়েছে!\nযেকোনো Excel বা Google Sheet-এ গিয়ে সরাসরি Paste করুন।');
                  }).catch(() => fallbackCopy(tsv));
                } else {
                  fallbackCopy(tsv);
                }
              }

              function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('✓ সম্পূর্ণ এক্সেল ডাটা কপি হয়েছে! Excel-এ গিয়ে Paste করুন।');
              }
            </script>
          </body>
          </html>
          EOF
