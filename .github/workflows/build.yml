                const form = document.getElementById('signupForm');
                if (form) form.reset();
                document.getElementById('signupId').value = '';
                document.getElementById('signupPin').value = '';
                document.getElementById('signupPinConfirm').value = '';
                document.getElementById('signupEmpDetails').classList.add('hidden');
                document.getElementById('signupEmpName').innerText = '';
                document.getElementById('signupEmpDesigSec').innerText = '';
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';
                document.getElementById('signupSubmitBtn').disabled = false;
                document.getElementById('signupSubmitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
              }

              function switchAuthTab(tab) {
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                if (tab === 'login') {
                  document.getElementById('loginForm').classList.remove('hidden');
                  document.getElementById('signupForm').classList.add('hidden');
                  document.getElementById('tabBtnLogin').className = 'flex-1 py-2 rounded-lg bg-emerald-500 text-slate-950 transition';
                  document.getElementById('tabBtnSignUp').className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
                } else {
                  clearSignUpForm();
                  document.getElementById('loginForm').classList.add('hidden');
                  document.getElementById('signupForm').classList.remove('hidden');
                  document.getElementById('tabBtnSignUp').className = 'flex-1 py-2 rounded-lg bg-blue-600 text-white transition';
                  document.getElementById('tabBtnLogin').className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
                }
