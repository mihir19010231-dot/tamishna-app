              function savePinVault(v) { localStorage.setItem('tsl_pin_vault_v11', JSON.stringify(v)); }

              async function hashPin(pin) {
                const encoder = new TextEncoder();
                const data = encoder.encode(pin + "_tsl_secure_salt_2026");
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
              }

              // SIGN UP
              async function handleSignupSubmit(e) {
                e.preventDefault();
                const idInput = document.getElementById('signupId').value.trim();
                const pinInput = document.getElementById('signupPin').value.trim();
                const confirmPin = document.getElementById('signupConfirmPin').value.trim();
                const alertEl = document.getElementById('authAlert');

                const users = getUsers();
                const found = users.find(u => u.id === idInput);

                if (!found) {
                  alertEl.innerText = 'ভুল Employee ID! সঠিক কার্ড নম্বর দিন।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                const vault = getPinVault();
                if (vault[found.id]) {
                  alertEl.innerText = 'এই আইডির অ্যাকাউন্ট ইতিমধ্যে সক্রিয় আছে! "লগইন" ট্যাবে যান।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                if (pinInput !== confirmPin) {
                  alertEl.innerText = 'দুই ঘরের পাসওয়ার্ড এক হয়নি! আবার চেক করে দিন।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                const inputHash = await hashPin(pinInput);
                vault[found.id] = inputHash;
                savePinVault(vault);

                alert('স্বাগতম ' + found.name + '!\nআপনার অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে। এখন লগইন করুন।');
                document.getElementById('signupId').value = '';
                document.getElementById('signupPin').value = '';
                document.getElementById('signupConfirmPin').value = '';
                document.getElementById('loginId').value = found.id;
                document.getElementById('loginPin').value = pinInput;
                switchAuthTab('login');
              }

              // LOGIN (WITH MASTER ADMIN PASSWORD 'tslhr')
              async function handleLoginSubmit(e) {
                e.preventDefault();
                const idInput = document.getElementById('loginId').value.trim();
                const pinInput = document.getElementById('loginPin').value.trim();
                const isRemember = document.getElementById('rememberMe').checked;
                const alertEl = document.getElementById('authAlert');

                const users = getUsers();
                const found = users.find(u => u.id === idInput);

                if (!found) {
                  alertEl.innerText = 'ভুল ID! সঠিক Employee ID লিখুন।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                // DIRECT MASTER ADMIN LOGIN CHECK
                if (found.id === MASTER_ADMIN_ID && pinInput === MASTER_ADMIN_PASS) {
                  if (isRemember) {
                    localStorage.setItem('tsl_remembered_user', JSON.stringify({ id: idInput, pin: pinInput }));
                  } else {
                    localStorage.removeItem('tsl_remembered_user');
                  }
                  currentUser = found;
                  showAppScreen();
                  return;
                }

                const vault = getPinVault();
                const existingHashedPin = vault[found.id];

                if (!existingHashedPin) {
                  alertEl.innerText = 'এই আইডি এখনও সাইন আপ করা হয়নি! প্রথমে "সাইন আপ" ট্যাবে গিয়ে পাসওয়ার্ড সেট করুন।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                const inputHash = await hashPin(pinInput);
                if (existingHashedPin !== inputHash) {
                  alertEl.innerText = 'ভুল Password/PIN! সঠিক গোপন কোড দিন।';
                  alertEl.className = 'p-2.5 mb-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                if (isRemember) {
                  localStorage.setItem('tsl_remembered_user', JSON.stringify({ id: idInput, pin: pinInput }));
                } else {
                  localStorage.removeItem('tsl_remembered_user');
                }

                currentUser = found;
                showAppScreen();
              }

              async function postToCloud(payload) {
                try {
                  await fetch(CLOUD_DB_URL, { method: 'POST', body: JSON.stringify(payload) });
                } catch (e) {
                  console.error('Cloud Sync Failed', e);
                }
              }

              async function syncFromCloud() {
                const syncEl = document.getElementById('syncStatusText');
                if (syncEl) syncEl.innerText = '🔄 সিঙ্ক হচ্ছে...';
                try {
                  const res = await fetch(CLOUD_DB_URL + '?t=' + Date.now());
                  if (res.ok) {
                    const data = await res.json();
                    if (data.attendance) saveRecords(data.attendance);
                    if (data.leaves) saveLeaves(data.leaves);
                    if (syncEl) syncEl.innerText = '✓ Cloud Synced (' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ')';
                    loadAdminDashboard();
                    return;
                  }
                } catch (e) {
                  console.error('Cloud fetch failed', e);
                }
                if (syncEl) syncEl.innerText = '⚠️ Offline Mode';
              }

              let currentUser = null;

              function tick() {
                const now = new Date();
                const clockEl = document.getElementById('clock');
                if (clockEl) clockEl.innerText = now.toLocaleTimeString();
                const dateEl = document.getElementById('dateStr');
                if (dateEl) dateEl.innerText = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
              }
              setInterval(tick, 1000);
              tick();

              function showAppScreen() {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('headerActions').classList.remove('hidden');
                document.getElementById('headerName').innerText = currentUser.name.split(' ')[0];
                injectLogos();

                if (currentUser.role === 'ADMIN') {
                  document.getElementById('punchView').classList.add('hidden');
                  document.getElementById('adminView').classList.remove('hidden');
                  syncFromCloud();
                } else {
                  document.getElementById('adminView').classList.add('hidden');
                  document.getElementById('punchView').classList.remove('hidden');
                  document.getElementById('userName').innerText = currentUser.name;
                  document.getElementById('userDesig').innerText = currentUser.desig;
                  document.getElementById('userId').innerText = currentUser.id;
                  document.getElementById('userSection').innerText = currentUser.section;
                  refreshEmployeeTodayPunch();
                  loadMyLeaves();
                }
              }

              function logout() {
                currentUser = null;
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('punchView').classList.add('hidden');
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('headerActions').classList.add('hidden');
                document.getElementById('punchStatusAlert').innerText = 'হাজিরা দিতে নিচের আঙ্গুলের ছাপ বাটনে চাপ দিন';
                checkRememberedLogin();
              }

              function refreshEmployeeTodayPunch() {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const records = getRecords();
                const record = records.find(r => r.empId === currentUser.id && r.date === today);
                document.getElementById('todayInText').innerText = record ? record.checkIn : '--:--';
                document.getElementById('todayOutText').innerText = (record && record.checkOut) ? record.checkOut : '--:--';

                const leaves = getLeaves();
                const approvedToday = leaves.find(l => l.empId === currentUser.id && l.status === 'APPROVED' && today >= l.fromDate && today <= l.toDate);
                if (approvedToday) {
                  document.getElementById('punchStatusAlert').innerHTML = '<span class="text-blue-400 font-bold">ℹ️ আপনি আজ অনুমোদিত ছুটিতে আছেন (' + approvedToday.type + ')</span>';
                }
              }

              function handlePunch(type) {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => r.empId === currentUser.id && r.date === today);

                if (type === 'CHECK_IN') {
                  if (existingIndex !== -1) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ ডুপ্লিকেট পাঞ্চ বাতিল! অলরেডি ইন করেছেন (' + records[existingIndex].checkIn + ')</span>';
                    return;
                  }
                  const recId = 'REC-' + Date.now();
                  records.unshift({
                    id: recId,
                    date: today,
                    empId: currentUser.id,
                    name: currentUser.name,
                    desig: currentUser.desig,
                    section: currentUser.section,
                    checkIn: timeStr,
                    checkOut: null,
                    status: 'PRESENT'
                  });
                  saveRecords(records);

                  postToCloud({
                    action: 'PUNCH',
                    type: 'CHECK_IN',
                    id: recId,
                    date: today,
                    empId: currentUser.id,
                    name: currentUser.name,
                    desig: currentUser.desig,
                    section: currentUser.section,
                    time: timeStr
                  });

                  alertEl.innerHTML = '<span class="text-emerald-400 font-bold">✓ ফিঙ্গারপ্রিন্ট ভেরিফাইড! চেক-ইন হয়েছে (' + timeStr + ')</span><br><span class="text-[9px] text-emerald-300">✓ ক্লাউড ডাটাবেজে সিঙ্ক হয়েছে</span>';
                } else {
                  if (existingIndex === -1) {
                    alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ আগে চেক-ইন (Check-In) করতে হবে!</span>';
                    return;
                  }
                  if (records[existingIndex].checkOut) {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ আজকের শিফট শেষ হয়েছে (' + records[existingIndex].checkOut + ')</span>';
                    return;
                  }
                  records[existingIndex].checkOut = timeStr;
                  saveRecords(records);

                  postToCloud({
                    action: 'PUNCH',
                    type: 'CHECK_OUT',
                    date: today,
                    empId: currentUser.id,
                    time: timeStr
                  });

                  alertEl.innerHTML = '<span class="text-rose-400 font-bold">✓ ফিঙ্গারপ্রিন্ট ভেরিফাইড! চেক-আউট হয়েছে (' + timeStr + ')</span><br><span class="text-[9px] text-emerald-300">✓ ক্লাউড ডাটাবেজে সিঙ্ক হয়েছে</span>';
                }
                refreshEmployeeTodayPunch();
              }

              function openLeaveApplyModal() {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('leaveFrom').value = today;
                document.getElementById('leaveTo').value = today;
                document.getElementById('leaveReason').value = '';
                document.getElementById('leaveApplyModal').classList.remove('hidden');
              }
              function closeLeaveApplyModal() {
                document.getElementById('leaveApplyModal').classList.add('hidden');
              }

              function handleLeaveSubmit(e) {
                e.preventDefault();
                if (!currentUser) return;
                const type = document.getElementById('leaveType').value;
                const fromDate = document.getElementById('leaveFrom').value;
                const toDate = document.getElementById('leaveTo').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (fromDate > toDate) {
                  alert('শুরুর তারিখ শেষের তারিখের চেয়ে বড় হতে পারবে না!');
                  return;
                }

                const leaveId = 'LV-' + Date.now();
                const appliedTime = new Date().toLocaleDateString('bn-BD') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const leaves = getLeaves();
                leaves.unshift({
                  id: leaveId,
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: appliedTime,
                  status: 'PENDING'
                });
                saveLeaves(leaves);

                postToCloud({
                  action: 'LEAVE_APPLY',
                  id: leaveId,
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: appliedTime
                });

                closeLeaveApplyModal();
                alert('ছুটির আবেদন সফলভাবে ক্লাউডে জমা হয়েছে! এডমিন অনুমোদনের পর কার্যকর হবে।');
                loadMyLeaves();
              }

              function loadMyLeaves() {
                if (!currentUser) return;
                const leaves = getLeaves().filter(l => l.empId === currentUser.id);
                const container = document.getElementById('myLeaveList');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-2">কোনো আবেদন করা হয়নি</p>';
                  return;
                }
                container.innerHTML = leaves.slice(0, 3).map(l => {
                  let badge = l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                              'bg-amber-500/20 text-amber-300 border-amber-500/40';
                  let statusText = l.status === 'APPROVED' ? 'অনুমোদিত' : l.status === 'REJECTED' ? 'বাতিল' : 'অপেক্ষারত';
                  return `
                    <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
                      <div>
                        <div class="flex items-center space-x-1.5">
                          <b class="text-white">${l.type}</b>
