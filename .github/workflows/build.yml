              }

              // 2. CENTRAL CLOUD SYNC
              async function pushPunchToCloud(record) {
                try {
                  fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                  }).catch(() => {});
                } catch(e) {}
