              function populateJobCardEmpDropdown() {
                const select = document.getElementById('jobCardEmpSelect');
                if (!select) return;
                const users = getUsers();
                select.innerHTML = users.map(u => `<option value="${u.id}">${u.id} - ${u.name} (${u.section})</option>`).join('');
                
