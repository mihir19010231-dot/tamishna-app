              function saveUsers(u) { localStorage.setItem('tsl_employees_v60', JSON.stringify(u)); }
              function getRecords() { return JSON.parse(localStorage.getItem('tsl_records_v60') || '[]'); }
              function saveRecords(d) { localStorage.setItem('tsl_records_v60', JSON.stringify(d)); }
              function getLeaves() { return JSON.parse(localStorage.getItem('tsl_leaves_v60') || '[]'); }
