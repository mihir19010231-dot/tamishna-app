              // ============================================================
              // 3. ONE-TAP FAST PUNCH WITH ACCURATE BANGLADESH DATE
              // ============================================================
              async function recordPunch(actionType) {
                if (!currentUser) return;
                const today = getBstDateStr();
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => String(r.empId).trim() === String(currentUser.id).trim() && String(r.date).trim() === today);

                if (actionType === 'CHECK_IN') {
                  if (existingIndex !== -1 && records[existingIndex].checkIn && records[existingIndex].checkIn !== '--:--') {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ Already Checked In today at ' + records[existingIndex].checkIn + '</span>';
                    return;
                  }
                } else {
                  if (existingIndex === -1) {
                    alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ Please Check-In first before Check-Out!</span>';
                    return;
                  }
                  if (records[existingIndex].checkOut && records[existingIndex].checkOut !== '--:--') {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ Already Checked Out today at ' + records[existingIndex].checkOut + '</span>';
                    return;
                  }
                }

                alertEl.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">✓ Punching ${actionType === 'CHECK_IN' ? 'In' : 'Out'}...</span>`;

                const punchRecord = {
                  id: (actionType === 'CHECK_IN' || existingIndex === -1) ? ('TSL-' + currentUser.id + '-' + today.replace(/-/g, '')) : records[existingIndex].id,
                  date: today,
                  empId: String(currentUser.id).trim(),
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  checkIn: actionType === 'CHECK_IN' ? timeStr : records[existingIndex].checkIn,
                  checkOut: actionType === 'CHECK_OUT' ? timeStr : (records[existingIndex] ? records[existingIndex].checkOut : null),
                  status: 'PRESENT'
                };

                if (existingIndex === -1) {
                  records.unshift(punchRecord);
                } else {
                  records[existingIndex] = punchRecord;
                }
                saveRecords(records);
                refreshEmployeeTodayPunch();

                const cloudSuccess = await pushPunchToCloud(punchRecord);
                if (cloudSuccess) {
                  alertEl.innerHTML = `<span class="text-emerald-400 font-bold">✓ Success! ${actionType === 'CHECK_IN' ? 'Checked In' : 'Checked Out'} at ${timeStr} (Google Sheet Synced)</span>`;
                } else {
                  alertEl.innerHTML = `<span class="text-amber-400 font-bold">✓ Saved Locally (${timeStr}). Auto-syncing in background.</span>`;
                }
              }

