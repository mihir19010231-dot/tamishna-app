              localStorage.setItem('tsl_employees_master', JSON.stringify(TAMISHNA_EMPLOYEES));

              // PERMANENT KEYS - WILL NEVER CHANGE WITH VERSION UPDATES
              function getUsers() { return JSON.parse(localStorage.getItem('tsl_employees_master')); }
              function getRecords() { return JSON.parse(localStorage.getItem('tsl_master_records') || '[]'); }
              function saveRecords(d) { localStorage.setItem('tsl_master_records', JSON.stringify(d)); }
              function getLeaves() { return JSON.parse(localStorage.getItem('tsl_master_leaves') || '[]'); }
              function saveLeaves(d) { localStorage.setItem('tsl_master_leaves', JSON.stringify(d)); }
              function getPinVault() { return JSON.parse(localStorage.getItem('tsl_master_pins_vault') || '{}'); }
              function savePinVault(v) { localStorage.setItem('tsl_master_pins_vault', JSON.stringify(v)); }

              async function hashPin(pin) {
                const encoder = new TextEncoder();
                const data = encoder.encode(pin + "_tsl_secure_salt_2026");
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
              }

              function loadRememberedCredentials() {
                const isRemembered = localStorage.getItem('tsl_remember_active') === 'true';
                const saved = localStorage.getItem('tsl_remembered_cred');
                if (isRemembered && saved) {
                  try {
                    const cred = JSON.parse(saved);
                    document.getElementById('loginId').value = cred.id || '';
                    document.getElementById('loginPin').value = cred.pin || '';
                    document.getElementById('rememberPinCheckbox').checked = true;
                  } catch(e) {}
                } else {
                  document.getElementById('loginId').value = '';
                  document.getElementById('loginPin').value = '';
                  document.getElementById('rememberPinCheckbox').checked = false;
                }
              }

              function handleRememberPinSave(id, pin) {
                const isChecked = document.getElementById('rememberPinCheckbox').checked;
                if (isChecked) {
                  localStorage.setItem('tsl_remember_active', 'true');
                  localStorage.setItem('tsl_remembered_cred', JSON.stringify({ id, pin }));
                } else {
                  localStorage.setItem('tsl_remember_active', 'false');
                  localStorage.removeItem('tsl_remembered_cred');
                }
              }

              // ============================================================
              // 2. ULTRA-FAST GOOGLE APPS SCRIPT ENGINE WITH ASYNC BACKGROUND SYNC
              // ============================================================
              const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbyArqQrKOY5p3T6ACEMlLPiYaCv1umVOB6uudbLnU_-pC6T_IKv8uN_8XkZPG_OZf6A/exec';
              let centralSyncInterval = null;

              async function callGoogleSheet(params = {}) {
                const query = new URLSearchParams(params).toString();
                const fullUrl = `${GOOGLE_SHEET_API_URL}?${query}`;

                // 1. Native Java Request (Highest priority, fastest and bypasses CORS/redirects)
                if (window.AndroidBridge && window.AndroidBridge.cloudGetRequest) {
                  try {
                    const raw = window.AndroidBridge.cloudGetRequest(fullUrl);
                    if (raw && raw.trim().startsWith('{')) {
                      return JSON.parse(raw);
                    }
                  } catch(e) {
                    console.warn('Native request error', e);
                  }
                }

                // 2. Standard fetch fallback
                try {
                  const res = await fetch(fullUrl, { method: 'GET', redirect: 'follow' });
                  if (res.ok) {
                    return await res.json();
                  }
                } catch(e) {
                  console.warn('Fetch fallback error', e);
                }
                return null;
              }

              async function pushPunchToCloud(record) {
                const res = await callGoogleSheet({ action: 'punch', data: JSON.stringify(record) });
                return res && res.status === 'success';
              }

              async function deleteFromCloud(recordId) {
                await callGoogleSheet({ action: 'deleteRecord', id: recordId });
              }

              async function clearCloudDatabase() {
                await callGoogleSheet({ action: 'clearAll' });
              }

              async function pullAllFromCloud(showAlert = false) {
                const res = await callGoogleSheet({ action: 'getRecords' });
                if (res && res.status === 'success') {
                  if (Array.isArray(res.records)) {
                    res.records.sort((a,b) => (b.date + (b.checkIn||'')).localeCompare(a.date + (a.checkIn||'')));
                    saveRecords(res.records);
                  }
                  if (Array.isArray(res.leaves)) {
                    saveLeaves(res.leaves);
                  }
                  if (res.pins && typeof res.pins === 'object') {
                    // Update master persistent pins vault
                    const existingVault = getPinVault();
                    const mergedPins = { ...existingVault, ...res.pins };
                    savePinVault(mergedPins);
                  }
                  if (showAlert) alert('✓ Connected to Google Sheet! Live data synced.');
                  
                  if (currentUser) {
                    if (currentUser.role === 'ADMIN') {
                      loadAdminDashboard();
                    } else {
                      refreshEmployeeTodayPunch();
                    }
                  }
                  return;
                }
                if (showAlert) alert('Google Sheet check completed.');
              }

              function startRealtimeCloudSync() {
                if (centralSyncInterval) clearInterval(centralSyncInterval);
                pullAllFromCloud(false);
                centralSyncInterval = setInterval(() => {
                  pullAllFromCloud(false);
                }, 5000);
              }

              // ============================================================
              // 3. STRICT 1-CHECKIN & 1-CHECKOUT DAILY LOCK ENGINE (LOCKED ON ALL DEVICES)
              // ============================================================
              function refreshEmployeeTodayPunch() {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const records = getRecords();
                const record = records.find(r => r.empId === currentUser.id && r.date === today);
                
                const btnIn = document.getElementById('btnCheckIn');
                const btnOut = document.getElementById('btnCheckOut');
                const alertEl = document.getElementById('punchStatusAlert');

                const checkInVal = (record && record.checkIn && record.checkIn !== '--:--') ? record.checkIn : null;
                const checkOutVal = (record && record.checkOut && record.checkOut !== '--:--') ? record.checkOut : null;

                document.getElementById('todayInText').innerText = checkInVal || '--:--';
                document.getElementById('todayOutText').innerText = checkOutVal || '--:--';

                // Reset button defaults
                btnIn.disabled = false;
                btnOut.disabled = false;
                btnIn.className = "bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-emerald-500 text-center flex flex-col items-center transition";
                btnOut.className = "bg-rose-600 hover:bg-rose-500 active:scale-95 text-white p-4 rounded-2xl shadow-lg border border-rose-500 text-center flex flex-col items-center transition";
                document.getElementById('btnCheckInText').innerText = "Punch Check-In";
                document.getElementById('btnCheckInSub').innerText = "Instant Entry";
                document.getElementById('btnCheckOutText').innerText = "Punch Check-Out";
                document.getElementById('btnCheckOutSub').innerText = "Instant Exit";

                if (checkInVal && checkOutVal) {
                  // Both completed -> Fully locked for today on all phones
                  btnIn.disabled = true;
                  btnOut.disabled = true;
                  btnIn.className = "bg-slate-800 text-slate-500 p-4 rounded-2xl border border-slate-700 text-center flex flex-col items-center opacity-60 cursor-not-allowed";
                  btnOut.className = "bg-slate-800 text-slate-500 p-4 rounded-2xl border border-slate-700 text-center flex flex-col items-center opacity-60 cursor-not-allowed";
                  document.getElementById('btnCheckInText').innerText = "Checked In";
                  document.getElementById('btnCheckInSub').innerText = checkInVal;
                  document.getElementById('btnCheckOutText').innerText = "Checked Out";
                  document.getElementById('btnCheckOutSub').innerText = checkOutVal;
                  alertEl.innerHTML = '<span class="text-amber-400 font-bold">✅ Attendance Cycle Completed for Today. Punches locked.</span>';
                } else if (checkInVal && !checkOutVal) {
                  // Check-In completed -> Lock Check-In, Keep Check-Out available
                  btnIn.disabled = true;
                  btnIn.className = "bg-slate-800 text-emerald-400 p-4 rounded-2xl border border-slate-700 text-center flex flex-col items-center opacity-70 cursor-not-allowed";
                  document.getElementById('btnCheckInText').innerText = "Checked In";
                  document.getElementById('btnCheckInSub').innerText = checkInVal;
                  alertEl.innerHTML = '<span class="text-emerald-400 font-bold">✓ Checked In at ' + checkInVal + '. Ready for Check-Out when shift ends.</span>';
                } else {
                  // Ready for check-in
                  alertEl.innerHTML = 'Tap button below to record attendance (One-Tap Instant Punch)';
                }
              }

              async function recordPunch(actionType) {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                const alertEl = document.getElementById('punchStatusAlert');
                let records = getRecords();
                let existingIndex = records.findIndex(r => r.empId === currentUser.id && r.date === today);

                // STRICT DAILY CHECK RULE ENFORCEMENT
                if (actionType === 'CHECK_IN') {
                  if (existingIndex !== -1 && records[existingIndex].checkIn && records[existingIndex].checkIn !== '--:--') {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ Already Checked In today at ' + records[existingIndex].checkIn + '. Multiple check-ins not allowed!</span>';
                    refreshEmployeeTodayPunch();
                    return;
                  }
                } else {
                  if (existingIndex === -1 || !records[existingIndex].checkIn || records[existingIndex].checkIn === '--:--') {
                    alertEl.innerHTML = '<span class="text-rose-400 font-bold">❌ Please Check-In first before Check-Out!</span>';
                    return;
                  }
                  if (records[existingIndex].checkOut && records[existingIndex].checkOut !== '--:--') {
                    alertEl.innerHTML = '<span class="text-amber-400 font-bold">⚠️ Already Checked Out today at ' + records[existingIndex].checkOut + '. Punches locked for today!</span>';
                    refreshEmployeeTodayPunch();
                    return;
                  }
                }

                alertEl.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">✓ Punching ${actionType === 'CHECK_IN' ? 'In' : 'Out'}...</span>`;

                const punchRecord = {
                  id: (actionType === 'CHECK_IN' || existingIndex === -1) ? ('TSL-' + currentUser.id + '-' + today.replace(/-/g, '')) : records[existingIndex].id,
                  date: today,
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  checkIn: actionType === 'CHECK_IN' ? timeStr : records[existingIndex].checkIn,
                  checkOut: actionType === 'CHECK_OUT' ? timeStr : null,
                  status: 'PRESENT'
                };

                if (actionType === 'CHECK_IN') {
                  records.unshift(punchRecord);
                } else {
                  records[existingIndex] = punchRecord;
                }
                saveRecords(records);
                refreshEmployeeTodayPunch();

                // Background sync to Google Sheet
                const cloudSuccess = await pushPunchToCloud(punchRecord);
                if (cloudSuccess) {
                  alertEl.innerHTML = `<span class="text-emerald-400 font-bold">✓ Success! ${actionType === 'CHECK_IN' ? 'Checked In' : 'Checked Out'} at ${timeStr} (Google Sheet Synced)</span>`;
                } else {
                  alertEl.innerHTML = `<span class="text-amber-400 font-bold">✓ Saved Locally (${timeStr}). Cloud sync in background.</span>`;
                }
                refreshEmployeeTodayPunch();
              }

