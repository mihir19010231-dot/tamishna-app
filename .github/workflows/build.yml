              async function handleLoginSubmit(e) {
                e.preventDefault();
                const idInput = document.getElementById('loginId').value.trim();
                const pinInput = document.getElementById('loginPin').value.trim();
                const alertEl = document.getElementById('authAlert');
                alertEl.className = 'hidden';

                const users = getUsers();
                const found = users.find(u => u.id === idInput);

                if (!found) {
                  alertEl.innerText = 'Invalid Card No! ID does not exist.';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                // Master Admin Universal Login
                if (found.role === 'ADMIN') {
                  const inputHash = await hashPin(pinInput);
                  let vault = getPinVault();
                  let adminHash = vault[found.id];

                  if (pinInput === '1234' || (adminHash && adminHash === inputHash)) {
                    handleRememberPinSave(idInput, pinInput);
                    currentUser = found;
                    showAppScreen();
                    return;
                  } else {
                    alertEl.innerText = 'Incorrect Admin PIN! (Default master PIN: 1234)';
                    alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                    return;
                  }
                }

                // Check PIN from permanent storage or Google Sheet
                let vault = getPinVault();
                let existingHashedPin = vault[found.id];

                if (!existingHashedPin) {
                  await pullAllFromCloud(false);
                  vault = getPinVault();
                  existingHashedPin = vault[found.id];
                }

                if (!existingHashedPin) {
                  alertEl.innerText = 'PIN not set yet! Please register via Sign Up tab first.';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs text-center font-medium';
                  return;
                }

                const inputHash = await hashPin(pinInput);
                if (existingHashedPin !== inputHash) {
                  alertEl.innerText = 'Incorrect PIN! Please enter the correct PIN.';
                  alertEl.className = 'p-2.5 mb-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center font-medium';
                  return;
                }

                handleRememberPinSave(idInput, pinInput);
                currentUser = found;
                showAppScreen();
              }

              function showAppScreen() {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('headerActions').classList.remove('hidden');
                document.getElementById('headerName').innerText = currentUser.role === 'ADMIN' ? 'Admin' : currentUser.name.split(' ')[0];
                injectLogos();

                if (currentUser.role === 'ADMIN') {
                  document.getElementById('punchView').classList.add('hidden');
                  document.getElementById('adminView').classList.remove('hidden');
                  populateJobCardEmpDropdown();
                  startRealtimeCloudSync();
                  loadAdminDashboard();
                } else {
                  document.getElementById('adminView').classList.add('hidden');
                  document.getElementById('punchView').classList.remove('hidden');
                  document.getElementById('userName').innerText = currentUser.name;
                  document.getElementById('userDesig').innerText = currentUser.desig;
                  document.getElementById('userId').innerText = currentUser.id;
                  document.getElementById('userSection').innerText = currentUser.section;
                  pullAllFromCloud(false).then(() => {
                    refreshEmployeeTodayPunch();
                  });
                }
              }

              function logout() {
                currentUser = null;
                if (centralSyncInterval) clearInterval(centralSyncInterval);
                document.getElementById('authView').classList.remove('hidden');
                document.getElementById('punchView').classList.add('hidden');
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('headerActions').classList.add('hidden');
                document.getElementById('punchStatusAlert').innerText = 'Tap button below to record attendance (One-Tap Instant Punch)';
                injectLogos();
                clearSignUpForm();
                loadRememberedCredentials();
              }

              function openLeaveApplyModal() {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('leaveFrom').value = today;
                document.getElementById('leaveTo').value = today;
                document.getElementById('leaveReason').value = '';
                document.getElementById('leaveApplyModal').classList.remove('hidden');
              }
              function closeLeaveApplyModal() {
                document.getElementById('leaveApplyModal').classList.add('hidden');
              }

              async function handleLeaveSubmit(e) {
                e.preventDefault();
                if (!currentUser) return;
                const type = document.getElementById('leaveType').value;
                const fromDate = document.getElementById('leaveFrom').value;
                const toDate = document.getElementById('leaveTo').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (fromDate > toDate) {
                  alert('From Date cannot be later than To Date!');
                  return;
                }

                const leaveObj = {
                  id: 'LV-' + Date.now(),
                  empId: currentUser.id,
                  name: currentUser.name,
                  desig: currentUser.desig,
                  section: currentUser.section,
                  type: type,
                  fromDate: fromDate,
                  toDate: toDate,
                  reason: reason,
                  appliedOn: new Date().toISOString().split('T')[0],
                  status: 'PENDING'
                };

                const leaves = getLeaves();
                leaves.unshift(leaveObj);
                saveLeaves(leaves);

                // Push Leave directly to Google Sheet
                await callGoogleSheet({ action: 'applyLeave', data: JSON.stringify(leaveObj) });

                closeLeaveApplyModal();
                alert('✓ Leave application submitted successfully to Google Sheet!');
              }

              function switchAdminTab(tab) {
                document.getElementById('adminAttSection').classList.add('hidden');
                document.getElementById('adminJobCardSection').classList.add('hidden');
                document.getElementById('adminLeaveSection').classList.add('hidden');
                document.getElementById('adminPinSection').classList.add('hidden');

                document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                document.getElementById('adminTabJobCard').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';
                document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white flex items-center justify-center space-x-1';
                document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg text-slate-400 font-bold hover:text-white';

                if (tab === 'att') {
                  document.getElementById('adminAttSection').classList.remove('hidden');
                  document.getElementById('adminTabAtt').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                } else if (tab === 'jobcard') {
                  document.getElementById('adminJobCardSection').classList.remove('hidden');
                  document.getElementById('adminTabJobCard').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  renderSelectedEmployeeJobCard();
                } else if (tab === 'leave') {
                  document.getElementById('adminLeaveSection').classList.remove('hidden');
                  document.getElementById('adminTabLeave').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center space-x-1';
                  loadAdminLeaveCards();
                } else if (tab === 'pin') {
                  document.getElementById('adminPinSection').classList.remove('hidden');
                  document.getElementById('adminTabPin').className = 'flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold';
                  loadAdminPinManagement();
                }
              }

              function loadAdminDashboard() {
                const records = getRecords();
                const totalEmployees = getUsers().length;
                const today = new Date().toISOString().split('T')[0];
                
                // Real-time unique daily attendance count
                const todayUniquePresentIds = new Set(
                  records.filter(r => r.date === today && r.checkIn && r.checkIn !== '--:--' && r.status === 'PRESENT').map(r => r.empId)
                );
                const todayPresentCount = todayUniquePresentIds.size;
                const todayAbsentCount = Math.max(0, totalEmployees - todayPresentCount);

                const leaves = getLeaves();
                const pendingLeaves = leaves.filter(l => l.status === 'PENDING');

                document.getElementById('totalEmpCount').innerText = totalEmployees;
                document.getElementById('todayPresentCount').innerText = todayPresentCount;
                document.getElementById('todayAbsentCount').innerText = todayAbsentCount;
                document.getElementById('pendingLeaveBadge').innerText = pendingLeaves.length;

                const tabBadge = document.getElementById('tabPendingBadge');
                if (pendingLeaves.length > 0) {
                  tabBadge.innerText = pendingLeaves.length;
                  tabBadge.classList.remove('hidden');
                } else {
                  tabBadge.classList.add('hidden');
                }

                const tbody = document.getElementById('adminTableBody');
                if (records.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-500 font-sans">No attendance records found</td></tr>';
                } else {
                  tbody.innerHTML = records.map(r => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="p-2.5 text-slate-400">${r.date}</td>
                      <td class="p-2.5 font-sans font-bold text-white">${r.name}<br><span class="text-[9px] font-mono text-emerald-400">${r.empId}</span></td>
                      <td class="p-2.5 text-slate-300 font-sans">${r.section}</td>
                      <td class="p-2.5 text-emerald-400 font-bold">${r.checkIn}</td>
                      <td class="p-2.5 text-rose-400 font-bold">${r.checkOut || '--:--'}</td>
                      <td class="p-2.5 font-sans"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-300">${r.status}</span></td>
                      <td class="p-2.5 text-center">
                        <button onclick="deleteSingleRecord('${r.id}')" class="p-1 text-rose-400 hover:text-rose-300 hover:bg-rose-500/20 rounded active:scale-90" title="Delete Record">
                          🗑️
                        </button>
                      </td>
                    </tr>
                  `).join('');
                }

                loadAdminLeaveCards();
                loadAdminPinManagement();
              }

              async function deleteSingleRecord(recordId) {
                if (confirm('Delete this attendance record?\nIt will be permanently removed from Google Sheet, Excel, and Job Card.')) {
                  let records = getRecords();
                  records = records.filter(r => r.id !== recordId);
                  saveRecords(records);

                  await deleteFromCloud(recordId);

                  loadAdminDashboard();
                  alert('✓ Record deleted from Google Sheet and app! (Punch unlocked if today\'s record)');
                }
              }

              function loadAdminLeaveCards() {
                const leaves = getLeaves();
                const container = document.getElementById('adminLeaveCardsContainer');
                if (leaves.length === 0) {
                  container.innerHTML = '<p class="text-slate-500 text-center py-6">No leave applications found</p>';
                  return;
                }
                container.innerHTML = leaves.map(l => `
                  <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-start">
                      <div>
                        <h4 class="font-bold text-white text-xs">${l.name} <span class="text-emerald-400 font-mono">(${l.empId})</span></h4>
                        <p class="text-[10px] text-slate-400">${l.desig} &bull; ${l.section}</p>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${l.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : l.status === 'REJECTED' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : 'bg-amber-500/20 text-amber-300 border-amber-500/40'}">${l.status} (${l.type})</span>
                    </div>
                    <div class="text-[11px] bg-slate-900 p-2 rounded border border-slate-800/80">
                      <p class="text-slate-300"><b>Duration:</b> ${l.fromDate} to ${l.toDate}</p>
                      <p class="text-slate-300 mt-0.5"><b>Reason:</b> ${l.reason}</p>
                    </div>
                    ${l.status === 'PENDING' ? `
                      <div class="flex space-x-2 pt-2 border-t border-slate-800">
                        <button onclick="updateLeaveStatus('${l.id}', 'APPROVED')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✓ Approve</button>
                        <button onclick="updateLeaveStatus('${l.id}', 'REJECTED')" class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-1.5 rounded-lg text-xs font-bold">✗ Reject</button>
                      </div>
                    ` : ''}
                  </div>
                `).join('');
              }

              async function updateLeaveStatus(leaveId, newStatus) {
                let leaves = getLeaves();
                let foundIndex = leaves.findIndex(l => l.id === leaveId);
                if (foundIndex === -1) return;

                leaves[foundIndex].status = newStatus;
                saveLeaves(leaves);

                // Update Google Sheet
                await callGoogleSheet({ action: 'updateLeaveStatus', data: JSON.stringify({ id: leaveId, status: newStatus }) });

                alert(newStatus === 'APPROVED' ? '✓ Leave Approved! Synced across Job Cards and Sheet.' : 'Leave rejected.');
                loadAdminDashboard();
                if (currentJobCardData && currentJobCardData.emp) {
                  renderSelectedEmployeeJobCard();
                }
              }

              function loadAdminPinManagement() {
                const users = getUsers();
                const vault = getPinVault();
                const tbody = document.getElementById('adminPinTableBody');

                tbody.innerHTML = users.map(u => `
                  <tr class="hover:bg-slate-800/40">
                    <td class="p-2.5 font-mono text-emerald-400 font-bold">${u.id}</td>
                    <td class="p-2.5 font-sans">${u.name}<br><span class="text-[9px] text-slate-400">${u.section}</span></td>
                    <td class="p-2.5">${vault[u.id] ? '<span class="text-emerald-400 font-semibold text-[10px]">✓ PIN Active</span>' : '<span class="text-amber-400 font-semibold text-[10px]">⚠️ Not Set</span>'}</td>
                    <td class="p-2.5">
                      <button onclick="resetUserPin('${u.id}', '${u.name}')" class="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded text-[10px] font-bold active:scale-95">
                        Reset
                      </button>
                    </td>
                  </tr>
                `).join('');
              }

              // ONLY ADMIN CAN RESET PIN - UNLESS RESET, USER PIN REMAINS PERMANENT
              async function resetUserPin(empId, empName) {
                if (confirm('Reset PIN for ' + empName + ' (' + empId + ')?\nOnce reset, the employee can register a new PIN.')) {
                  const vault = getPinVault();
                  delete vault[empId];
                  savePinVault(vault);
                  await callGoogleSheet({ action: 'savePin', data: JSON.stringify({ id: empId, hash: '', name: empName }) });
                  alert('✓ PIN Reset successfully! The employee can now set a new PIN.');
                  loadAdminPinManagement();
                }
              }

              // 100% DIRECT DOWNLOAD FOR EXCEL / CSV (SYNC FIRST, NO DELETED DATA)
              async function exportAttendanceCSV() {
                await pullAllFromCloud(false);
                const records = getRecords();
                if (records.length === 0) {
                  alert('No attendance records to export!');
                  return;
                }
                let csv = 'DATE,CARD_NO,EMPLOYEE_NAME,SECTION,IN_TIME,OUT_TIME,STATUS\n';
                records.forEach(r => {
                  csv += `"${r.date}","${r.empId}","${r.name}","${r.section}","${r.checkIn}","${r.checkOut || ''}","${r.status}"\n`;
                });
                
                const filename = `Tamishna_ERP_Attendance_${new Date().toISOString().split('T')[0]}.csv`;

                if (window.AndroidBridge && window.AndroidBridge.saveCsvToDownloads) {
                  window.AndroidBridge.saveCsvToDownloads(csv, filename);
                } else {
                  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = filename;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  alert('✓ Attendance Excel CSV downloaded successfully!');
                }
              }

              async function clearAllData() {
                if (confirm('Delete ALL attendance records permanently?\nThis will clear the Google Sheet, device records, and Excel.')) {
                  localStorage.removeItem('tsl_master_records');
                  await clearCloudDatabase();
                  loadAdminDashboard();
                  alert('✓ All attendance records have been cleared from Google Sheet and app!');
                }
              }

              document.addEventListener('DOMContentLoaded', loadRememberedCredentials);
              setTimeout(loadRememberedCredentials, 200);
            </script>
          </body>
          </html>
